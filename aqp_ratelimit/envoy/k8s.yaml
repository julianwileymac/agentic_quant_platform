---
# AQP rate-limit forward proxy — Kubernetes deployment + service.
# Mounted in aqp-system. Connector pods and notebook kernels set
# HTTPS_PROXY=http://rl-proxy.aqp-system.svc.cluster.local:8080.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rl-proxy-envoy-config
  namespace: aqp-system
data:
  bootstrap.yaml: |
    # See aqp_ratelimit/envoy/bootstrap.yaml for the canonical
    # bootstrap; this ConfigMap is rendered from that file by the
    # `aqp deploy` CLI so changes stay in one place.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rl-proxy
  namespace: aqp-system
  labels:
    app.kubernetes.io/name: rl-proxy
    app.kubernetes.io/part-of: aqp-ratelimit
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: rl-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rl-proxy
        app.kubernetes.io/part-of: aqp-ratelimit
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.31-latest
          args:
            - "-c"
            - "/etc/envoy/bootstrap.yaml"
            - "--service-cluster"
            - "rl-proxy"
            - "--service-node"
            - "$(POD_NAME)"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http-proxy
              containerPort: 8080
            - name: admin
              containerPort: 9901
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: 9901
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: rl-proxy-envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: rl-proxy
  namespace: aqp-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rl-proxy
  ports:
    - name: http-proxy
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqp-rls
  namespace: aqp-system
  labels:
    app.kubernetes.io/name: aqp-rls
    app.kubernetes.io/part-of: aqp-ratelimit
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: aqp-rls
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aqp-rls
        app.kubernetes.io/part-of: aqp-ratelimit
    spec:
      containers:
        - name: aqp-rls
          image: ghcr.io/aqp/aqp-rls:0.1.0
          env:
            - name: AQP_RATELIMIT_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: aqp-ratelimit-secrets
                  key: redis_url
            - name: AQP_RLS_GRPC_PORT
              value: ":50051"
            - name: AQP_RLS_HTTP_PORT
              value: ":8080"
            - name: AQP_RLS_METRICS_PORT
              value: ":9102"
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9102
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aqp-rls
  namespace: aqp-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aqp-rls
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9102
      targetPort: 9102
