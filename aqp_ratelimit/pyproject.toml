[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aqp-ratelimit"
version = "0.1.0"
description = "Per-(user, service, key_id) rate-limit accounting subsystem for the Agentic Quant Platform — IngestionRateLimitStrategy ABC, Redis Lua token bucket, Go RLS service, Envoy descriptor filter, replay cache, data.ratelimit.* MCP tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AQP Platform Team" }]
keywords = ["aqp", "rate-limit", "token-bucket", "redis", "envoy", "ingestion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "redis>=5.0",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.25",
    "structlog>=24.1",
]

[project.optional-dependencies]
replay = [
    "boto3>=1.34",
    "vcrpy>=6.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "fakeredis>=2.20",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/julianwiley/agentic_quant_platform"
Issues = "https://github.com/julianwiley/agentic_quant_platform/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aqp_ratelimit"]

[tool.hatch.build.targets.sdist]
include = [
    "src/aqp_ratelimit",
    "tasks",
    "api",
    "configs",
    "lua",
    "envoy",
    "tests",
    "README.md",
    "AGENTS.md",
    "INDEX.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "N"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
