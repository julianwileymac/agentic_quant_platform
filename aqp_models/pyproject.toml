[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aqp-models"
version = "0.1.0"
description = "Custom model pulling, building, training, fine-tuning, evaluating, and testing for the Agentic Quant Platform — qlib-style ML framework + Predictor Hub + alpha backtest experiments + walk-forward + finetune trainers + custom vLLM / Ollama model serving."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AQP Platform Team" }]
keywords = ["aqp", "machine-learning", "ml", "qlib", "alpha", "finetune", "vllm", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core ML deps. Heavier framework families (torch zoo, anomaly, forecast,
# keras, tensorflow, transformers, custom serving) live behind extras so
# the base install stays light.
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[project.optional-dependencies]
ml = [
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "statsmodels>=0.14",
    "pandas-ta-classic>=0.3.15",
]
ml-torch = [
    "torch>=2.1",
    "pytorch-tabnet>=4.1",
]
ml-graph = ["torch-geometric>=2.5"]
ml-forecast = [
    "prophet>=1.1.5",
    "sktime>=0.29",
    "pmdarima>=2.0",
]
ml-anomaly = ["pyod>=1.1.3"]
ml-keras = ["keras>=3.0"]
ml-tensorflow = [
    "tensorflow>=2.16",
    "keras>=3.0",
]
ml-transformers = [
    "transformers>=4.40",
    "accelerate>=0.30",
]
finetune = [
    "transformers>=4.40",
    "accelerate>=0.30",
    "peft>=0.11",
    "sentencepiece>=0.2",
]
# Custom model-serving stack — vLLM (in-process or self-hosted) + Ollama
# (local OSS model pulling). Kept optional so the base install does not
# require GPU / Rust toolchains.
serving-vllm = [
    "vllm>=0.5",
]
serving-ollama = [
    "httpx>=0.27",
]
serving = [
    "aqp-models[serving-vllm,serving-ollama]",
]
all-frameworks = [
    "aqp-models[ml,ml-torch,ml-forecast,ml-anomaly,ml-keras,ml-transformers,finetune,serving]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/julianwiley/agentic_quant_platform"
Issues = "https://github.com/julianwiley/agentic_quant_platform/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aqp_models"]

[tool.hatch.build.targets.sdist]
include = [
    "src/aqp_models",
    "tasks",
    "api",
    "configs",
    "tests",
    "README.md",
    "AGENTS.md",
    "INDEX.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "N"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
