# Pre-commit hooks — Phase 0 audit-closure gates.
#
# Mirrors the `phase0-lints` job in `.github/workflows/ci.yml` so the
# same hard-rule checks run BEFORE the commit hits the remote, not
# only on the PR. Install with:
#
#     pip install pre-commit
#     pre-commit install
#
# Every hook here MUST stay in lockstep with the CI job — adding a
# new lint script means adding it both here and in ci.yml.
#
# Per the Restructuring Plan §3.6 the five Phase 0 deliverable lints
# are PR-blocking, never `|| true`. Hooks below intentionally have NO
# `verbose: false` / `always_run: false` overrides that would skip
# them.

repos:
  - repo: local
    hooks:
      # ---------------------------------------------------------------
      # AGENTS Rule 6 — Alembic migrations are immutable + linear.
      # ---------------------------------------------------------------
      - id: aqp-migration-immutability
        name: AQP Rule 6 — migration immutability (sha256 lock)
        entry: python scripts/ci/check_migration_immutability.py
        language: system
        pass_filenames: false
        # Migrations + the lock are the only things that can break it.
        files: ^alembic/versions/

      - id: aqp-migration-chain
        name: AQP Rule 6 — migration chain (single head, no orphans)
        entry: python scripts/ci/check_migration_chain.py
        language: system
        pass_filenames: false
        files: ^alembic/versions/.*\.py$

      # ---------------------------------------------------------------
      # AGENTS Rule 26 — CredentialResolver-only access.
      # ---------------------------------------------------------------
      - id: aqp-credential-resolver
        name: AQP Rule 26 — CredentialResolver (no settings.*_token reads)
        entry: python scripts/ci/check_credential_resolver.py
        language: system
        pass_filenames: false
        # The lint walks the full tree; run on any .py change so it
        # catches violations regardless of where they land.
        files: \.py$

      # ---------------------------------------------------------------
      # AGENTS Rule 29 — Typed entity inputs via <EntityPicker />.
      # ---------------------------------------------------------------
      - id: aqp-entity-picker
        name: AQP Rule 29 — EntityPicker (no free-text URN inputs)
        entry: python scripts/ci/check_entity_picker.py
        language: system
        pass_filenames: false
        files: \.tsx$

      # ---------------------------------------------------------------
      # AGENTS Rule 22 — Agent boundary (no direct aqp.persistence
      # imports inside aqp/agents/* outside ledger-writer exceptions).
      # ---------------------------------------------------------------
      - id: aqp-agent-boundary
        name: AQP Rule 22 — agent boundary (no aqp.persistence imports)
        entry: python scripts/ci/check_agent_boundary.py
        language: system
        pass_filenames: false
        files: ^aqp/agents/.*\.py$

      # ---------------------------------------------------------------
      # Style — ban Pydantic V1 ``.dict()`` / ``.parse_obj()`` etc.
      # ---------------------------------------------------------------
      - id: aqp-no-pydantic-v1
        name: AQP Style — Pydantic V1 surface ban (.dict / .parse_obj)
        entry: python scripts/ci/check_no_pydantic_v1.py
        language: system
        pass_filenames: false
        files: \.py$

      # ---------------------------------------------------------------
      # Phase 1 §4.2 — generic cross-subproject boundary lint. One
      # hook per extracted subproject so violations are reported per
      # boundary instead of mixed together. Each hook fires only when
      # the relevant subproject's source tree changes.
      # ---------------------------------------------------------------
      - id: aqp-boundary-aqp-control-plane
        name: AQP §4.2 — boundary lint (aqp_control_plane)
        entry: python scripts/ci/check_boundary.py --scan-root aqp_control_plane/src --lint-name boundary_aqp_control_plane --forbid aqp --allow aqp_platform_core --allow aqp_cp
        language: system
        pass_filenames: false
        files: ^aqp_control_plane/src/.*\.py$

      - id: aqp-boundary-aqp-admin
        name: AQP §4.2 — boundary lint (aqp_admin)
        entry: python scripts/ci/check_boundary.py --scan-root aqp_admin/src --lint-name boundary_aqp_admin --forbid aqp --forbid aqp_cp --allow aqp_platform_core --allow aqp_admin
        language: system
        pass_filenames: false
        files: ^aqp_admin/src/.*\.py$

      - id: aqp-boundary-aqp-cli
        name: AQP §4.2 — boundary lint (aqp_cli)
        entry: python scripts/ci/check_boundary.py --scan-root aqp_cli/src --lint-name boundary_aqp_cli --forbid aqp --forbid aqp_cp --allow aqp_platform_core --allow aqp_cli
        language: system
        pass_filenames: false
        files: ^aqp_cli/src/.*\.py$

      - id: aqp-boundary-aqp-ingest
        name: AQP §4.2 — boundary lint (aqp_ingest)
        entry: python scripts/ci/check_boundary.py --scan-root aqp_ingest/src --lint-name boundary_aqp_ingest --forbid aqp.api --forbid aqp.persistence
        language: system
        pass_filenames: false
        files: ^aqp_ingest/src/.*\.py$

      - id: aqp-boundary-aqp-kernels
        name: AQP §4.2 — boundary lint (aqp_kernels)
        entry: python scripts/ci/check_boundary.py --scan-root aqp_kernels/src --lint-name boundary_aqp_kernels --forbid aqp.persistence --forbid aqp.api
        language: system
        pass_filenames: false
        files: ^aqp_kernels/src/.*\.py$

      - id: aqp-boundary-aqp-ratelimit
        name: AQP §4.2 — boundary lint (aqp_ratelimit)
        entry: python scripts/ci/check_boundary.py --scan-root aqp_ratelimit/src --lint-name boundary_aqp_ratelimit --forbid aqp.persistence --forbid aqp.api
        language: system
        pass_filenames: false
        files: ^aqp_ratelimit/src/.*\.py$

      - id: aqp-boundary-aqp-rl
        name: AQP §4.2 — boundary lint (aqp_rl)
        entry: python scripts/ci/check_boundary.py --scan-root aqp_rl/src --lint-name boundary_aqp_rl --forbid aqp --allow aqp_platform_core --allow aqp_rl --allow aqp.llm.providers.router --allow aqp.data.iceberg_catalog --allow aqp.risk.limits
        language: system
        pass_filenames: false
        files: ^aqp_rl/src/.*\.py$

      - id: aqp-boundary-aqp-models
        name: AQP §4.2 — boundary lint (aqp_models)
        entry: python scripts/ci/check_boundary.py --scan-root aqp_models/src --lint-name boundary_aqp_models --forbid aqp --allow aqp_platform_core --allow aqp_models --allow aqp.llm.providers.router
        language: system
        pass_filenames: false
        files: ^aqp_models/src/.*\.py$

      - id: aqp-boundary-aqp-bots
        name: AQP §4.2 — boundary lint (aqp_bots)
        entry: python scripts/ci/check_boundary.py --scan-root aqp_bots --lint-name boundary_aqp_bots --forbid aqp.api --forbid aqp.persistence --exclude __pycache__ --exclude templates
        language: system
        pass_filenames: false
        files: ^aqp_bots/(?!templates/).*\.py$

      # ---------------------------------------------------------------
      # Phase 1 §4.5 — seven new rule-specific lints. Each ships with
      # an allowlist at scripts/ci/allowlists/<lint>.txt for existing
      # tree violations, with explicit Phase-2 (2026-09-30) deadlines.
      # The hooks mirror the `hard-rule-lints` CI job 1:1 — adding a
      # new lint script means adding it both here and in ci.yml.
      # ---------------------------------------------------------------
      - id: aqp-no-direct-redis-publish
        name: AQP Rule 4 — no direct redis.publish (use _progress.emit)
        entry: python scripts/ci/check_no_direct_redis_publish.py
        language: system
        pass_filenames: false
        files: \.py$

      - id: aqp-no-print
        name: AQP Rule 9 — logging discipline (ruff T20 / no print/pprint)
        entry: ruff check --select T20 --no-fix
        language: system
        pass_filenames: false
        files: \.py$

      - id: aqp-no-direct-redis-ft
        name: AQP Rule 11 — no direct redis_client.ft outside aqp/rag/
        entry: python scripts/ci/check_no_direct_redis_ft.py
        language: system
        pass_filenames: false
        files: \.py$

      - id: aqp-no-hardcoded-svc-urls
        name: AQP Rule 47 — no hardcoded *.svc.cluster.local URLs
        entry: python scripts/ci/check_no_hardcoded_svc_urls.py
        language: system
        pass_filenames: false
        # Scan source-style files only; the lint exempts deployment
        # surface internally.
        files: \.(py|pyi|ts|tsx|js|jsx|yaml|yml|sh|env)$

      - id: aqp-mcp-audience
        name: AQP Rule 49 — MCP audience (RFC 8707 validation on /mcp/* routers)
        entry: python scripts/ci/check_mcp_audience.py
        language: system
        pass_filenames: false
        files: \.py$

      - id: aqp-step-up-mfa
        name: AQP Rule 52 — step-up MFA (RFC 9470 on destructive routes)
        entry: python scripts/ci/check_step_up_mfa.py
        language: system
        pass_filenames: false
        files: \.py$

      - id: aqp-no-broker-settings
        name: AQP Rule 55 — no direct settings.<broker>_* reads (BYOK only)
        entry: python scripts/ci/check_no_broker_settings.py
        language: system
        pass_filenames: false
        files: \.py$
