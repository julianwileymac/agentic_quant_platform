name: "Bootstrap Technical Search"
description: >
  Trade only the technical-rule combinations whose historical Sharpe
  beats the 99th percentile of a block-bootstrap synthetic null
  distribution. Reference: MS&E 448 Stanford 2016 (technical
  strategy search). The `rules` list is fitted offline via
  `aqp.strategies.hft.automated_technical_search.search_rules`.

strategy:
  class: BootstrapTechSearchAlpha
  module_path: aqp.strategies.hft.automated_technical_search
  kwargs:
    rules: []  # fit offline; surviving rules are injected here
    order_size: 1.0
    max_position: 10.0
    buffer: 256

backtest:
  class: LobBacktestEngine
  module_path: aqp.backtest.hft
  kwargs:
    latency_profile: intp_order_latency
    queue_model: probabilistic
    dataset_preset: lob_btcusdt_sample
    max_events: 500000
