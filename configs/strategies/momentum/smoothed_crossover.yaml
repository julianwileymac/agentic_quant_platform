name: "Smoothed MA Crossover"
description: >
  EMA-smoothed fast/slow moving-average crossover. Smoothing the
  close-price series before computing the MAs suppresses the
  whipsaws that plague raw MA crossover strategies in choppy
  markets.

strategy:
  class: FrameworkAlgorithm
  module_path: aqp.strategies.framework
  kwargs:
    universe_model:
      class: StaticUniverse
      module_path: aqp.strategies.universes
      kwargs:
        symbols: [SPY, QQQ, IWM]
    alpha_model:
      class: SmoothedMACrossoverAlpha
      module_path: aqp.strategies.momentum.smoothed_crossover
      kwargs:
        fast_window: 20
        slow_window: 50
        smooth_alpha: 0.3
        threshold: 0.0
        hold_bars: 5
    portfolio_model:
      class: EqualWeightPortfolio
      module_path: aqp.strategies.portfolio
      kwargs:
        max_positions: 3
    risk_model:
      class: BasicRiskModel
      module_path: aqp.strategies.risk_models
      kwargs:
        max_position_pct: 0.4
        max_drawdown_pct: 0.2
    execution_model:
      class: MarketOrderExecution
      module_path: aqp.strategies.execution
      kwargs: {}

backtest:
  class: EventDrivenBacktester
  module_path: aqp.backtest.engine
  kwargs:
    initial_cash: 100000.0
    commission_pct: 0.0005
    slippage_bps: 2.0
    start: "2020-01-01"
    end: "2024-12-31"
