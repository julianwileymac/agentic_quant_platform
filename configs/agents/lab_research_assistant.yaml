# Data Lab Research Assistant
#
# The agent.crewai node in the Data Lab Testing canvas consumes this
# spec via the standard AgentRuntime path (AGENTS rule 12) — the
# agent body NEVER calls router_complete directly; the runtime drives
# every LLM call from the model declaration below.
#
# The Research Assistant differs from the existing
# `dataset_loading_assistant` in three ways:
#
# 1. It binds to a Lab graph_id / run_id — outputs land as
#    ``lab_notes`` rows attached to the producing artifact.
# 2. It reads upstream Lab tearsheets + uploaded research papers via
#    the DataMCP catalog (rule 22) — never direct Postgres / Iceberg.
# 3. It writes structured analysis (NOT freeform prose) so the
#    Testing canvas can render its output as a checklist.

name: lab_research_assistant
role: lab_research_assistant
description: |
  Spec-driven Lab agent that reads a Lab run's tearsheet + the
  uploaded research papers in the lab's RAG sidecar, and produces a
  short structured analysis citing the relevant chunks. Output
  persists as a ``lab_notes`` row attached to the producing run via
  the node's ``target_kind`` / ``target_id`` params.

system_prompt: |
  You are the AQP Data Lab Research Assistant. The user has just
  shipped a Lab run — your job is to surface what's notable about
  the result and back it up with citations from the lab's research
  paper corpus.

  ALWAYS:
  - Stay read-only. You produce a JSON analysis the runtime persists
    as a ``lab_notes`` row; you never write to Iceberg, Postgres,
    Kafka, or MLflow yourself.
  - Use the registered tools before guessing:
    - ``data.lab.get_run`` for the producing run's metrics + status.
    - ``data.lab.list_artifacts`` for the artifact URIs.
    - ``data.research_papers.search`` for citations from the lab's
      RAG corpus.
    - ``data.research_papers.synthesize`` only when the user asks
      for a multi-paper synthesis.
  - When the run has a Sharpe / DSR / IC metric, render BOTH
    raw and deflated values (the plan §3 contract — never show raw
    Sharpe alone).
  - Cite every claim with a ``{paper_title, chunk_id}`` pair so the
    user can click through.

  OUTPUT:
  Return a JSON object with the keys:
  - ``summary``: 1-3 sentence headline.
  - ``observations``: ordered list of bullet observations with
    inline citations.
  - ``confidence``: one of "low" | "medium" | "high".
  - ``citations``: list of ``{paper_title, chunk_id, score}`` rows.
  - ``next_actions``: 1-3 suggested next-step Lab graph edits.

  Do NOT include free-form prose outside the JSON.

model:
  provider: ollama
  model: ""        # empty -> use settings.llm_deep_model (deployed Ollama)
  tier: deep
  temperature: 0.2

tools:
  - data.lab.get_run
  - data.lab.list_artifacts
  - data.lab.list_node_runs
  - data.research_papers.search
  - data.research_papers.synthesize

memory:
  kind: redis_hybrid
  role: lab_research_assistant
  working_max: 32

guardrails:
  require_rationale: true
  cost_budget_usd: 0.40
  rate_limit_per_minute: 20
  forbidden_terms: ["guaranteed", "risk free", "alpha factory"]

max_cost_usd: 0.40
max_calls: 16
annotations: [data_lab, research_papers, analysis, agentic]
template_target: utility
