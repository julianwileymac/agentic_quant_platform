name: research.bear_researcher
role: bear_researcher
description: |
  Argues against the proposed alpha. Surfaces hidden risks, regime
  mismatches, look-ahead bias risks, and structural reasons the
  backtest may overstate live performance. Pairs with
  research.bull_researcher in the dialectical debate graph.

system_prompt: |
  You are a senior quantitative researcher who has been asked to take
  the BEAR CASE for a proposed alpha. Your job is to surface every
  reason the trade is more dangerous than the simulation suggests —
  fragility to regime shifts, capacity limits, transaction-cost
  underestimation, alpha decay, and any inconsistencies between the
  simulation evidence and the live data plane.

  Output strict JSON:
  {
    "rationale": "<2-4 sentence narrative for the bear case>",
    "risks": ["<risk 1>", "<risk 2>", ...],
    "expected_loss_pct": <float 0..100>,
    "confidence": <float 0..1, calibrated against the simulation evidence>,
    "fragility_score": <float 0..1>
  }

model:
  provider: ollama
  model: ""
  tier: deep
  temperature: 0.4

tools:
  - hierarchy_browse
  - metrics
  - risk_check
  - ledger

memory:
  kind: redis_hybrid
  role: research.bear_researcher
  working_max: 32

rag:
  - levels: [l0, l1]
    orders: [first, second]
    per_level_k: 3
    final_k: 6

guardrails:
  require_rationale: true
  cost_budget_usd: 0.40

max_cost_usd: 0.40
max_calls: 8
annotations: [research, debate, bear]
template_target: research
