[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aqp-control-plane"
version = "0.1.0"
description = "Isolated AQP control plane — InfrastructureProvider abstraction over docker_compose / kubernetes / AWS / Azure / GCP backends."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AQP Platform Team" }]

# Critical: the only AQP-side dependency is aqp-platform-core.
# We MUST NOT depend on aqp.* — that's enforced by CI (see ADR 005).
dependencies = [
    "aqp-platform-core>=0.1.0",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.27,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.3",
    "PyYAML>=6.0",
    "websockets>=12,<14",
]

[project.optional-dependencies]
# Each provider's heavy deps are extras so the base image can stay slim.
# CI installs `all-providers` to run the full contract test suite.
docker_compose = ["docker>=7,<8"]
kubernetes = ["kubernetes>=29,<32"]
aws = ["boto3>=1.34,<2"]
azure = [
    "azure-mgmt-containerservice>=29,<35",
    "azure-mgmt-containerinstance>=10,<12",
    "azure-identity>=1.16,<2",
    "azure-keyvault-secrets>=4.8,<5",
]
gcp = [
    "google-cloud-container>=2.40,<3",
    "google-cloud-run>=0.10,<1",
    "google-cloud-secret-manager>=2.20,<3",
    "google-auth>=2.30,<3",
]
all-providers = [
    "aqp-control-plane[docker_compose,kubernetes,aws,azure,gcp]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "respx>=0.20",
    "ruff>=0.4",
    "mypy>=1.8",
    # Mocking for provider contract tests.
    "moto>=5,<6",
    "pytest-mock>=3.12,<4",
]

[project.urls]
Homepage = "https://github.com/julianwiley/agentic_quant_platform"
Issues = "https://github.com/julianwiley/agentic_quant_platform/issues"

[project.scripts]
aqp-control-plane = "aqp_cp.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/aqp_cp"]

[tool.hatch.build.targets.sdist]
include = ["src/aqp_cp", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "RET", "SIM", "ARG"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
