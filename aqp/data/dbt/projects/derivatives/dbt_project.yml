name: aqp_dbt_derivatives
version: '0.1.0'
config-version: 2
profile: aqp_questdb

model-paths: ['models']
test-paths: ['tests']
macro-paths: ['macros']
target-path: 'target'

require-dbt-version: ['>=1.9.0', '<2.0.0']

models:
  aqp_dbt_derivatives:
    intermediate:
      +materialized: ephemeral
      +schema: derivatives_int
      +access: protected
    marts:
      +materialized: questdb_table
      +schema: derivatives_marts
      +access: protected
