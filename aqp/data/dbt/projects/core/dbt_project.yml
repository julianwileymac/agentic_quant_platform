name: aqp_dbt_core
version: '0.1.0'
config-version: 2
profile: aqp_questdb

model-paths: ['models']
analysis-paths: ['analyses']
test-paths: ['tests']
seed-paths: ['seeds']
macro-paths: ['macros']
snapshot-paths: ['snapshots']

target-path: 'target'
clean-targets:
  - 'target'
  - 'dbt_packages'

models:
  aqp_dbt_core:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
      +schema: intermediate
    core_facts:
      +materialized: questdb_incremental
      +schema: core_facts
      +access: public

snapshots:
  aqp_dbt_core:
    +target_schema: snapshots
    +strategy: timestamp
    +updated_at: updated_at
    +tags: ['snapshot:serial']

vars:
  dbt_date:default_timezone: UTC
