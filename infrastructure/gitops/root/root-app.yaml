###############################################################################
# Root app-of-apps — single Application that ArgoCD bootstraps from.
###############################################################################
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aqp-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/julianwileymac/agentic_quant_platform
    targetRevision: main
    path: infrastructure/gitops/applicationsets
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
