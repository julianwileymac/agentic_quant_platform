[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aqp-cli"
version = "0.1.0"
description = "Standalone operator CLI for the Agentic Quant Platform: bootstrap setup, detect running services, fetch updates, and authenticate (primarily through the control plane, optionally direct)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AQP Platform Team" }]

# No direct dependency on aqp.* or aqp_control_plane.* source — this CLI
# is an external client that talks over HTTP to the AQP API and the
# control-plane API. Heavy provider deps belong in extras.
dependencies = [
    "typer>=0.12,<1",
    "httpx>=0.27,<1",
    "rich>=13.7,<14",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
docker = ["docker>=7,<8"]
kubernetes = ["kubernetes>=29,<32"]
# `keyring` enables OS-native credential storage (macOS Keychain,
# Windows Credential Locker, Linux Secret Service). `keyrings.alt`
# adds an AES-encrypted file backend so headless Linux servers
# without a Secret Service still get encrypted persistence.
keyring = ["keyring>=24,<26", "keyrings.alt>=5,<6"]
all-probes = ["aqp-cli[docker,kubernetes,keyring]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "respx>=0.20",
    "ruff>=0.4",
    "mypy>=1.8",
    # Match the `keyring` optional extra so the unit + integration
    # tests can exercise the OS-native backend on developer machines.
    "keyring>=24,<26",
]

[project.scripts]
aqp-cli = "aqp_cli.cli:app"
aqp = "aqp_cli.cli:app"

[project.urls]
Homepage = "https://github.com/julianwiley/agentic_quant_platform"
Issues = "https://github.com/julianwiley/agentic_quant_platform/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aqp_cli"]

[tool.hatch.build.targets.sdist]
include = ["src/aqp_cli", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "RET", "SIM", "ARG"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
