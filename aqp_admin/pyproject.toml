[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aqp-admin"
version = "0.1.0"
description = "Internal admin backend for AQP's managed services and company accounts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AQP Platform Team" }]

# Same boundary as aqp_control_plane: depend on aqp-platform-core only,
# never on aqp.*. Enforced by the CI rg check in AGENTS.md.
dependencies = [
    "aqp-platform-core>=0.1.0",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.27,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
stripe = ["stripe>=10,<13"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "respx>=0.20",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
aqp-admin-api = "aqp_admin.main:cli"
aqp-cli-admin-api = "aqp_admin.main:cli"

[project.urls]
Homepage = "https://github.com/julianwiley/agentic_quant_platform"
Issues = "https://github.com/julianwiley/agentic_quant_platform/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aqp_admin"]

[tool.hatch.build.targets.sdist]
include = ["src/aqp_admin", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "RET", "SIM", "ARG"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
