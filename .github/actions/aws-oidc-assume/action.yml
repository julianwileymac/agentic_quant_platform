name: aws-oidc-assume
description: Assume an AWS role via the GitHub Actions OIDC trust.
inputs:
  role-arn:
    description: ARN of the role to assume.
    required: true
  region:
    description: AWS region for the session.
    required: false
    default: us-east-1
  session-name:
    description: STS session name.
    required: false
    default: gha-session
  duration-seconds:
    description: STS session duration.
    required: false
    default: "3600"
  external-id:
    description: Optional external id when the trust policy requires one.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: configure-credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        role-session-name: ${{ inputs.session-name }}
        role-duration-seconds: ${{ inputs.duration-seconds }}
        aws-region: ${{ inputs.region }}
        role-external-id: ${{ inputs.external-id }}
        mask-aws-account-id: true
