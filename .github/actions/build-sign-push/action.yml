name: build-sign-push
description: Multi-arch buildx + Cosign keyless sign + Syft SBOM + ECR push.
inputs:
  service:
    description: Service name (also the ECR repo name).
    required: true
  registry:
    description: ECR registry URL.
    required: true
  dockerfile:
    description: Path to the Dockerfile.
    required: true
  context:
    description: Build context.
    required: false
    default: "."
  platforms:
    description: Target platforms.
    required: false
    default: linux/amd64,linux/arm64
  tag:
    description: Image tag (typically the git SHA).
    required: true
  push:
    description: Whether to push (set false on PRs).
    required: false
    default: "true"
outputs:
  image-uri:
    description: Full image URI including registry + tag.
    value: ${{ steps.image.outputs.uri }}
  digest:
    description: Image digest after push.
    value: ${{ steps.build.outputs.digest }}
runs:
  using: composite
  steps:
    - id: image
      shell: bash
      run: |
        echo "uri=${{ inputs.registry }}/${{ inputs.service }}:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - uses: aws-actions/amazon-ecr-login@v2
      id: ecr
      with:
        mask-password: true
    - id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        tags: ${{ steps.image.outputs.uri }}
        push: ${{ inputs.push }}
        provenance: mode=max
        sbom: true
    - name: cosign-keyless-sign
      if: inputs.push == 'true'
      uses: sigstore/cosign-installer@v3
    - if: inputs.push == 'true'
      shell: bash
      run: |
        cosign sign --yes \
          ${{ inputs.registry }}/${{ inputs.service }}@${{ steps.build.outputs.digest }}
    - if: inputs.push == 'true'
      uses: actions/attest-build-provenance@v2
      with:
        subject-name: ${{ inputs.registry }}/${{ inputs.service }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true
    - if: inputs.push == 'true'
      uses: anchore/sbom-action@v0
      with:
        image: ${{ steps.image.outputs.uri }}
        format: spdx-json
        output-file: sbom-${{ inputs.service }}.spdx.json
