name: Security scan

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "aqp_platform/build/docker/**"
      - "aqp_control_plane/**"
      - "aqp_platform_core/**"

permissions:
  contents: read
  security-events: write

jobs:
  trivy-images:
    name: Trivy container scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - aqp-client
          - aqp-control-plane
          - aqp-worker
          - aqp-ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build (load, no push)
        if: hashFiles(format('aqp_platform/build/docker/{0}/Dockerfile', matrix.image)) != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: aqp_platform/build/docker/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: aqp-scan/${{ matrix.image }}:scan
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: aqp-scan/${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  bandit-python:
    name: Bandit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      # Phase 1 §4.6 — bandit `|| true` here is intentional: the SARIF
      # output (uploaded below) is the authoritative gate, surfacing
      # findings in the GitHub Security tab. Without `|| true` a single
      # low-severity finding kills the SARIF upload step too, so
      # operators lose the dashboarded view. The follow-up below adds a
      # PR-blocking strict gate for the proven-clean subset.
      - name: Bandit SARIF (informational; uploads to GitHub Security)
        run: |
          bandit -r aqp_platform_core/src -ll -f sarif -o bandit-platform-core.sarif || true
          bandit -r aqp_control_plane/src -ll -f sarif -o bandit-control-plane.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-platform-core.sarif
          category: bandit-platform-core
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-control-plane.sarif
          category: bandit-control-plane
      # Phase 2 §4.6 ratchet — strict gate on high-severity findings
      # only. Bandit `-lll` filters to high-severity; the SARIF upload
      # above continues to surface medium/low findings as advisories
      # in the Security tab while this step blocks on critical issues.
      - name: Bandit strict gate (high-severity, PR-blocking)
        run: |
          bandit -r aqp_platform_core/src -lll -q
          bandit -r aqp_control_plane/src -lll -q

  npm-audit:
    name: npm audit (aqp_client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - run: cd aqp_client && pnpm install --frozen-lockfile
      # Phase 1 §4.6 — `|| true` is intentional here. CVE remediation
      # is owned by Renovate / Dependabot (§4.7), which raises PRs
      # tagged with the appropriate severity. `pnpm audit` is run for
      # visibility (its output is captured in the job log) but is NOT
      # the gating mechanism — that's the dependency-bot PR review
      # workflow.
      - name: pnpm audit (informational; CVE gating via Renovate/Dependabot)
        run: cd aqp_client && pnpm audit --audit-level high || true

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
