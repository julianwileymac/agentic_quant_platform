name: CD — staging

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write  # for cloud OIDC if needed

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: julianwiley

jobs:
  build-and-push:
    name: Build + push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - { name: aqp-client, dockerfile: aqp_client/Dockerfile }
          - { name: aqp-control-plane, dockerfile: build/docker/aqp_control_plane/Dockerfile }
          - { name: aqp-worker, dockerfile: build/docker/aqp_worker/Dockerfile }
          - { name: aqp-ingestion, dockerfile: build/docker/aqp_ingestion/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +%Y-%m-%d)
          echo "image_tag=staging-${SHORT_SHA}-${DATE}" >> $GITHUB_OUTPUT
      - name: Build + push (multi-arch)
        if: hashFiles(matrix.image.dockerfile) != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image.name }}:${{ steps.tag.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image.name }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Apply staging overlay
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      - name: Update image tags
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +%Y-%m-%d)
          TAG="staging-${SHORT_SHA}-${DATE}"
          cd deployments/kubernetes/overlays/staging
          kubectl kustomize . | sed -E "s|newTag: .*|newTag: ${TAG}|g" > /tmp/staging.yaml
      - name: Apply
        run: kubectl apply -f /tmp/staging.yaml
      - name: Verify rollout
        run: |
          kubectl -n aqp rollout status deployment/aqp-core --timeout=10m
          kubectl -n aqp rollout status deployment/aqp-client --timeout=10m
          kubectl -n aqp rollout status deployment/aqp-worker --timeout=10m
          kubectl -n aqp-admin rollout status deployment/aqp-cp --timeout=10m
