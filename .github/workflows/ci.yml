name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
      - name: ruff (root)
        run: ruff check aqp aqp_platform_core/src aqp_control_plane/src aqp_platform/build/scripts || true
      - name: ruff (format check)
        run: ruff format --check aqp_platform_core/src aqp_control_plane/src aqp_platform/build/scripts || true

  phase0-lints:
    name: Phase 0 audit-closure lints
    runs-on: ubuntu-latest
    # Phase 0 (Restructuring Plan §3) wires the five hard-rule lints
    # to PR-blocking status. Each script ships with its own per-lint
    # allowlist at `scripts/ci/allowlists/` so existing-tree violations
    # carry an explicit Phase 1 removal deadline rather than silently
    # passing. NEVER add `|| true` to these steps — that's the whole
    # reason they exist (Phase 0 deliverable §3.6 + Phase 1 §4.6).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install alembic (for migration-chain head/parent topology check)
        run: |
          python -m pip install --upgrade pip
          pip install "alembic>=1.13"
      - name: Rule 6 — migration immutability (sha256 lock at alembic/versions/.hashes.lock)
        run: python scripts/ci/check_migration_immutability.py
      - name: Rule 6 — migration chain (single head, no orphan parents, no shared down_revision)
        run: python scripts/ci/check_migration_chain.py
      - name: Rule 26 — CredentialResolver (no direct settings.*_token / _secret / _key reads)
        run: python scripts/ci/check_credential_resolver.py
      - name: Rule 29 — EntityPicker (no free-text URN inputs in .tsx)
        run: python scripts/ci/check_entity_picker.py
      - name: Rule 22 — agent boundary (no direct aqp.persistence imports inside aqp/agents/*)
        run: python scripts/ci/check_agent_boundary.py
      - name: Style — Pydantic V1 surface (.dict / .parse_obj / .parse_raw / .from_orm)
        run: python scripts/ci/check_no_pydantic_v1.py

  test-platform-core:
    name: aqp_platform_core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./aqp_platform_core[dev]
      - name: Test
        run: cd aqp_platform_core && pytest -ra --cov=aqp_platform_core --cov-report=term

  test-control-plane:
    name: aqp_control_plane tests
    runs-on: ubuntu-latest
    needs: test-platform-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./aqp_platform_core
          pip install -e ./aqp_control_plane[dev,docker_compose,kubernetes]
      - name: Strict-isolation lint (NO aqp.* imports inside aqp_control_plane)
        run: |
          # Allow aqp_platform_core / aqp_cp / aqp- (in strings); fail on bare `aqp.`
          if grep -RnE '^(from|import)\s+aqp(\.|\s|$)' aqp_control_plane/src \
               | grep -vE '(aqp_platform_core|aqp_cp)'; then
            echo "FAIL: aqp_control_plane imports forbidden aqp.* module (ADR 005)"
            exit 1
          fi
      - name: Test
        run: cd aqp_control_plane && pytest -ra --cov=aqp_cp --cov-report=term

  validate-config:
    name: validate config schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate + diff
        run: |
          python aqp_platform/build/scripts/generate_config.py --env local --diff
          python aqp_platform/build/scripts/generate_config.py --env cloud --diff
          python aqp_platform/build/scripts/generate_config.py --env k8s --kind configmap --diff
          python aqp_platform/build/scripts/generate_config.py --env k8s --kind secret --diff

  validate-k8s-manifests:
    name: kubectl validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: kubectl --dry-run=client over base + every overlay
        run: |
          set -e
          for env in dev staging prod; do
            echo "=== Validating overlay: $env ==="
            kubectl kustomize aqp_platform/deployments/kubernetes/overlays/$env > /tmp/$env.yaml
            kubectl apply --dry-run=client -f /tmp/$env.yaml
          done

  openapi-export:
    name: export openapi (control-plane)
    runs-on: ubuntu-latest
    needs: [test-platform-core, test-control-plane]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./aqp_platform_core
          pip install -e ./aqp_control_plane[docker_compose]
      - name: Export control-plane OpenAPI
        run: |
          python -c "import json; from aqp_cp.main import create_app; \
            print(json.dumps(create_app().openapi(), indent=2))" \
            > /tmp/aqp-control-plane.openapi.json
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-control-plane
          path: /tmp/aqp-control-plane.openapi.json
      - name: oasdiff drift check (control-plane)
        run: |
          curl -sSL -o /tmp/oasdiff.tgz https://github.com/Tufin/oasdiff/releases/download/v2.5.4/oasdiff_2.5.4_linux_amd64.tar.gz
          tar -xzf /tmp/oasdiff.tgz -C /tmp oasdiff
          chmod +x /tmp/oasdiff
          # Drift: committed spec must equal the freshly dumped spec.
          /tmp/oasdiff diff aqp_docs/openapi/control-plane.json /tmp/aqp-control-plane.openapi.json --fail-on ERR --format text
      - name: oasdiff breaking-change check (control-plane)
        run: |
          # Breaking changes against `main` require a PR label + Changeset.
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch origin main
            git show origin/main:aqp_docs/openapi/control-plane.json > /tmp/main-control-plane.json || echo '{}' > /tmp/main-control-plane.json
            BREAKING=$(/tmp/oasdiff breaking /tmp/main-control-plane.json /tmp/aqp-control-plane.openapi.json --format text || true)
            if [[ -n "${BREAKING}" && "${BREAKING}" != "No breaking changes" ]]; then
              echo "::warning::Breaking changes detected. Ensure PR has the breaking-change label + a Changeset."
              echo "${BREAKING}"
            fi
          fi

  openapi-export-aqp:
    name: export openapi (aqp main api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (lightweight — only dependencies needed for app.openapi() to render)
        run: |
          python -m pip install --upgrade pip
          # The main app's openapi() does not require its full runtime
          # dependency graph; only the FastAPI + Pydantic surface +
          # any registry-import that happens at module load. We install
          # the aqp package in editable mode.
          pip install -e ".[dev]" || pip install fastapi pydantic
      - name: Export aqp main API OpenAPI
        run: |
          python -c "
          import json
          try:
              from aqp.api.main import create_app
          except Exception as exc:  # pragma: no cover - dev surface
              # Soft-fail: emit a minimal stub spec rather than blocking
              # the whole pipeline. The drift gate below will still
              # detect divergence the moment the import path is fixed.
              print(json.dumps({'openapi': '3.0.3', 'info': {'title': 'AQP API', 'version': '0.0.0-stub'}, 'paths': {}}, indent=2))
          else:
              print(json.dumps(create_app().openapi(), indent=2))
          " > /tmp/aqp.openapi.json
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-aqp
          path: /tmp/aqp.openapi.json
      - name: oasdiff drift check (aqp main)
        run: |
          curl -sSL -o /tmp/oasdiff.tgz https://github.com/Tufin/oasdiff/releases/download/v2.5.4/oasdiff_2.5.4_linux_amd64.tar.gz
          tar -xzf /tmp/oasdiff.tgz -C /tmp oasdiff
          chmod +x /tmp/oasdiff
          /tmp/oasdiff diff aqp_docs/openapi/aqp.json /tmp/aqp.openapi.json --fail-on ERR --format text || {
            echo "::error::OpenAPI drift detected. Run 'pnpm --filter aqp_docs run dump-openapi' to refresh the committed spec." >&2
            exit 1
          }
      - name: oasdiff breaking-change check (aqp main)
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch origin main
            git show origin/main:aqp_docs/openapi/aqp.json > /tmp/main-aqp.json || echo '{}' > /tmp/main-aqp.json
            BREAKING=$(/tmp/oasdiff breaking /tmp/main-aqp.json /tmp/aqp.openapi.json --format text || true)
            if [[ -n "${BREAKING}" && "${BREAKING}" != "No breaking changes" ]]; then
              echo "::warning::Breaking changes detected. Ensure PR has the breaking-change label + a Changeset entry."
              echo "${BREAKING}"
            fi
          fi

  griffe-check:
    name: python api surface diff (griffe)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install griffe
        run: |
          python -m pip install --upgrade pip
          pip install "griffe>=1.5" "griffe-pydantic>=0.1.4"
      - name: Diff public Python surface vs main
        run: |
          mkdir -p /tmp/griffe-out
          for pkg_path in aqp aqp_rl/src/aqp_rl aqp_models/src/aqp_models aqp_control_plane/src/aqp_cp aqp_platform_core/src/aqp_platform_core; do
            pkg_name=$(basename "${pkg_path}")
            python -c "
          import json
          from griffe import GriffeLoader
          loader = GriffeLoader()
          obj = loader.load('${pkg_name}', search_paths=['${pkg_path%/*}'])
          loader.resolve_aliases(implicit=True, external=True)
          # Just dump a digest of public-symbol signatures.
          out = {}
          for member in obj.modules.values():
              for sym, val in member.members.items():
                  if sym.startswith('_'):
                      continue
                  out[f'{member.canonical_path}.{sym}'] = str(val.canonical_path)
          print(json.dumps(out, indent=2))
          " > /tmp/griffe-out/${pkg_name}.json 2>/dev/null || true
          done
      - name: Comment PR with API-surface diff summary
        if: always()
        run: |
          echo 'griffe check finished — see job output for the surface digest. A first-class diff comment will land in Phase 6.'
