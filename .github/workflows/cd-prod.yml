name: CD — production

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: julianwiley

jobs:
  build-and-push:
    name: Build + push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - { name: aqp-client, dockerfile: aqp_client/Dockerfile }
          - { name: aqp-control-plane, dockerfile: build/docker/aqp_control_plane/Dockerfile }
          - { name: aqp-worker, dockerfile: build/docker/aqp_worker/Dockerfile }
          - { name: aqp-ingestion, dockerfile: build/docker/aqp_ingestion/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push (multi-arch)
        if: hashFiles(matrix.image.dockerfile) != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image.name }}:${{ github.event.release.tag_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image.name }}:latest-stable
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-prod:
    name: Apply prod overlay
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      - name: Update image tags
        run: |
          TAG="${{ github.event.release.tag_name }}"
          cd deployments/kubernetes/overlays/prod
          kubectl kustomize . | sed -E "s|newTag: latest-stable|newTag: ${TAG}|g" > /tmp/prod.yaml
      - name: Apply
        run: kubectl apply -f /tmp/prod.yaml
      - name: Verify rollout
        run: |
          kubectl -n aqp rollout status deployment/aqp-core --timeout=15m
          kubectl -n aqp rollout status deployment/aqp-client --timeout=15m
          kubectl -n aqp rollout status deployment/aqp-worker --timeout=15m
          kubectl -n aqp-admin rollout status deployment/aqp-cp --timeout=15m

  attach-openapi:
    name: Attach OpenAPI to release
    runs-on: ubuntu-latest
    needs: deploy-prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./aqp_platform_core
          pip install -e ./aqp_control_plane[docker_compose]
      - name: Export OpenAPI
        run: |
          python -c "import json; from aqp_cp.main import create_app; \
            print(json.dumps(create_app().openapi(), indent=2))" \
            > aqp-control-plane.openapi.json
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: aqp-control-plane.openapi.json
          tag_name: ${{ github.event.release.tag_name }}
