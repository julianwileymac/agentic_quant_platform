name: Build multi-arch images

# Phase 4c of the AQP control-plane maturation. Builds the canonical
# AQP Docker images for both linux/amd64 (standard cloud nodes) and
# linux/arm64 (the rpi_kubernetes Raspberry Pi 5 edge cluster) on every
# push to ``main`` and on every ``v*`` tag, then pushes to
# ``docker.io/julianwiley/aqp-*`` (Docker Hub). The Kubernetes deployments under
# ``aqp_platform/deployments/kubernetes/base/`` carry a soft ``kubernetes.io/arch``
# nodeAffinity so a pod scheduled onto either arch will pull the
# matching layer automatically.
#
# This workflow is ADDITIVE — it does NOT replace ``cd-prod.yml``,
# which still drives release-tagged image promotion + cluster
# rollouts. ``build-multi-arch.yml`` is the developer-loop workflow
# that keeps an arm64 image always available for ad-hoc RPi testing.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - "aqp_client/Dockerfile"
      - "aqp/**"
      - "aqp_bots/**"
      - "aqp_control_plane/**"
      - "aqp_platform_core/**"
      - "aqp_client/**"
      - "pyproject.toml"
      - ".github/workflows/build-multi-arch.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "aqp_client/Dockerfile"
      - "aqp/api/main.py"
      - "aqp_bots/**"
      - "aqp/auth/**"
      - "aqp/tasks/celery_app.py"
      - "aqp_platform/deployments/kubernetes/base/**"
  workflow_dispatch:
    inputs:
      rollback:
        description: >
          Build the rollback / legacy-management images under
          aqp_platform/rollback/ (rpi_k8s_sdk + legacy-management).
          DEFAULT is 'false' — those Dockerfiles are intentionally NOT
          part of the canonical Phase 4c multi-arch matrix and only
          ship under explicit operator dispatch (RESTRUCTURING_PLAN.md
          Phase 2 §5.5). Flipping this flag does NOT currently rebuild
          them; that is the follow-up to Phase 2 §5.5 once the
          rollback Dockerfiles themselves are split into their own
          job. The flag exists today as the policy-anchor input so
          reviewers see the gate.
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Phase 2 §5.2 — Cosign keyless OIDC signing + SBOM attestation
# requires three additional permissions on top of the existing
# contents: read:
#   - id-token: write    OIDC token for keyless Sigstore signing
#   - packages: write    push attestations to the registry alongside
#                        the image (cosign attaches manifest by digest)
#   - attestations: write opt-in for SLSA-3 build provenance
# These mirror the proven pattern in quantbot-bots-image.yml.
permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

env:
  REGISTRY: docker.io
  IMAGE_OWNER: julianwiley
  # Phase 2 §5.2 — pinned cosign release (matches quantbot pattern).
  COSIGN_VERSION: v2.2.4

concurrency:
  group: build-multi-arch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-and-worker:
    name: aqp-api / aqp-worker (api target)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        shell: bash
        run: |
          ref="${{ github.ref_name }}"
          sha="${{ github.sha }}"
          short_sha="${sha:0:7}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            tag="pr-${{ github.event.pull_request.number }}-$short_sha"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="$ref"
          else
            tag="$ref-$short_sha"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Build + push aqp-api (multi-arch)
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: api
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aqp-api:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aqp-api:latest
          cache-from: type=gha,scope=aqp-api
          cache-to: type=gha,mode=max,scope=aqp-api
          provenance: false

      - name: Build + push aqp-worker (uses the same api image at runtime)
        id: build-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: api
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aqp-worker:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aqp-worker:latest
          cache-from: type=gha,scope=aqp-api
          provenance: false

      # ===================================================================
      # Phase 2 §5.2 — Supply chain hardening on aqp-api + aqp-worker.
      #
      # All sign / attest / scan steps gate on the push events because
      # Cosign keyless signing requires OIDC, which is unavailable on
      # PRs from forks. PR-internal builds still run (and load locally
      # via cache), but they neither push nor sign.
      # ===================================================================
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Install syft
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action/download-syft@v0

      - name: Install grype
        if: github.event_name != 'pull_request'
        uses: anchore/scan-action/download-grype@v3

      - name: Generate SBOM for aqp-api (CycloneDX)
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aqp-api@${{ steps.build-api.outputs.digest }}
        run: |
          syft "${IMAGE_REF}" \
            -o cyclonedx-json=sbom-aqp-api.cdx.json

      - name: Cosign sign aqp-api (keyless via OIDC)
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aqp-api@${{ steps.build-api.outputs.digest }}
          COSIGN_YES: "true"
        run: cosign sign --yes "${IMAGE_REF}"

      - name: Cosign attest SBOM for aqp-api
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aqp-api@${{ steps.build-api.outputs.digest }}
          COSIGN_YES: "true"
        run: |
          cosign attest --yes \
            --predicate sbom-aqp-api.cdx.json \
            --type cyclonedx \
            "${IMAGE_REF}"

      - name: Grype scan aqp-api (fail on HIGH+)
        if: github.event_name != 'pull_request'
        run: grype sbom:./sbom-aqp-api.cdx.json --fail-on high

      - name: Generate SBOM for aqp-worker (CycloneDX)
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aqp-worker@${{ steps.build-worker.outputs.digest }}
        run: |
          syft "${IMAGE_REF}" \
            -o cyclonedx-json=sbom-aqp-worker.cdx.json

      - name: Cosign sign aqp-worker (keyless via OIDC)
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aqp-worker@${{ steps.build-worker.outputs.digest }}
          COSIGN_YES: "true"
        run: cosign sign --yes "${IMAGE_REF}"

      - name: Cosign attest SBOM for aqp-worker
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aqp-worker@${{ steps.build-worker.outputs.digest }}
          COSIGN_YES: "true"
        run: |
          cosign attest --yes \
            --predicate sbom-aqp-worker.cdx.json \
            --type cyclonedx \
            "${IMAGE_REF}"

      - name: Grype scan aqp-worker (fail on HIGH+)
        if: github.event_name != 'pull_request'
        run: grype sbom:./sbom-aqp-worker.cdx.json --fail-on high

      - name: Upload SBOM artifacts (aqp-api + aqp-worker)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-api-worker-${{ steps.tag.outputs.short_sha }}
          path: sbom-aqp-*.cdx.json
          if-no-files-found: error

  client:
    name: aqp-client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        shell: bash
        run: |
          ref="${{ github.ref_name }}"
          sha="${{ github.sha }}"
          short_sha="${sha:0:7}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            tag="pr-${{ github.event.pull_request.number }}-$short_sha"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="$ref"
          else
            tag="$ref-$short_sha"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Build + push aqp-client (multi-arch)
        id: build-client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./aqp_client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aqp-client:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aqp-client:latest
          cache-from: type=gha,scope=aqp-client
          cache-to: type=gha,mode=max,scope=aqp-client
          provenance: false

      # ===================================================================
      # Phase 2 §5.2 — Supply chain hardening on aqp-client. Mirrors the
      # api-and-worker block above.
      # ===================================================================
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Install syft
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action/download-syft@v0

      - name: Install grype
        if: github.event_name != 'pull_request'
        uses: anchore/scan-action/download-grype@v3

      - name: Generate SBOM for aqp-client (CycloneDX)
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aqp-client@${{ steps.build-client.outputs.digest }}
        run: |
          syft "${IMAGE_REF}" \
            -o cyclonedx-json=sbom-aqp-client.cdx.json

      - name: Cosign sign aqp-client (keyless via OIDC)
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aqp-client@${{ steps.build-client.outputs.digest }}
          COSIGN_YES: "true"
        run: cosign sign --yes "${IMAGE_REF}"

      - name: Cosign attest SBOM for aqp-client
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aqp-client@${{ steps.build-client.outputs.digest }}
          COSIGN_YES: "true"
        run: |
          cosign attest --yes \
            --predicate sbom-aqp-client.cdx.json \
            --type cyclonedx \
            "${IMAGE_REF}"

      - name: Grype scan aqp-client (fail on HIGH+)
        if: github.event_name != 'pull_request'
        run: grype sbom:./sbom-aqp-client.cdx.json --fail-on high

      - name: Upload SBOM artifact (aqp-client)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-client-${{ steps.tag.outputs.short_sha }}
          path: sbom-aqp-client.cdx.json
          if-no-files-found: error

  inspect:
    name: Verify multi-arch manifests + cosign signatures
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [api-and-worker, client]
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Inspect manifests
        run: |
          for image in aqp-api aqp-worker aqp-client; do
            echo "=== $image:latest ==="
            docker buildx imagetools inspect "${REGISTRY}/${IMAGE_OWNER}/$image:latest" || true
          done
      # Phase 2 §5.2 — verify the cosign keyless signature + the
      # CycloneDX SBOM attestation actually landed on the registry.
      # `cosign verify` and `cosign verify-attestation` use Rekor as
      # the source of truth — a missing entry fails the gate, which
      # protects against a registry-side replay that overwrites the
      # signed tag with an unsigned one.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Cosign verify (keyless, GHA workflow identity)
        env:
          # Subject identity = the GHA workflow file that produced the
          # signature. Matches sigstore's default keyless workflow.
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build-multi-arch.yml@refs/heads/main
          CERT_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          for image in aqp-api aqp-worker aqp-client; do
            echo "=== verifying $image:latest ==="
            cosign verify \
              --certificate-identity-regexp "${CERT_IDENTITY%@*}@.*" \
              --certificate-oidc-issuer "${CERT_OIDC_ISSUER}" \
              "${REGISTRY}/${IMAGE_OWNER}/$image:latest" \
              > /dev/null
            echo "=== verifying $image:latest SBOM attestation ==="
            cosign verify-attestation \
              --certificate-identity-regexp "${CERT_IDENTITY%@*}@.*" \
              --certificate-oidc-issuer "${CERT_OIDC_ISSUER}" \
              --type cyclonedx \
              "${REGISTRY}/${IMAGE_OWNER}/$image:latest" \
              > /dev/null
          done
