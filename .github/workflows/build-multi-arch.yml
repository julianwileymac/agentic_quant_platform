name: Build multi-arch images

# Phase 4c of the AQP control-plane maturation. Builds the canonical
# AQP Docker images for both linux/amd64 (standard cloud nodes) and
# linux/arm64 (the rpi_kubernetes Raspberry Pi 5 edge cluster) on every
# push to ``main`` and on every ``v*`` tag, then pushes to
# ``docker.io/julianwiley/aqp-*`` (Docker Hub). The Kubernetes deployments under
# ``aqp_platform/deployments/kubernetes/base/`` carry a soft ``kubernetes.io/arch``
# nodeAffinity so a pod scheduled onto either arch will pull the
# matching layer automatically.
#
# This workflow is ADDITIVE — it does NOT replace ``cd-prod.yml``,
# which still drives release-tagged image promotion + cluster
# rollouts. ``build-multi-arch.yml`` is the developer-loop workflow
# that keeps an arm64 image always available for ad-hoc RPi testing.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - "aqp_client/Dockerfile"
      - "aqp/**"
      - "aqp_bots/**"
      - "aqp_control_plane/**"
      - "aqp_platform_core/**"
      - "aqp_client/**"
      - "pyproject.toml"
      - ".github/workflows/build-multi-arch.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "aqp_client/Dockerfile"
      - "aqp/api/main.py"
      - "aqp_bots/**"
      - "aqp/auth/**"
      - "aqp/tasks/celery_app.py"
      - "aqp_platform/deployments/kubernetes/base/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_OWNER: julianwiley

concurrency:
  group: build-multi-arch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-and-worker:
    name: aqp-api / aqp-worker (api target)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        shell: bash
        run: |
          ref="${{ github.ref_name }}"
          sha="${{ github.sha }}"
          short_sha="${sha:0:7}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            tag="pr-${{ github.event.pull_request.number }}-$short_sha"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="$ref"
          else
            tag="$ref-$short_sha"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Build + push aqp-api (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: api
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aqp-api:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aqp-api:latest
          cache-from: type=gha,scope=aqp-api
          cache-to: type=gha,mode=max,scope=aqp-api
          provenance: false

      - name: Build + push aqp-worker (uses the same api image at runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: api
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aqp-worker:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aqp-worker:latest
          cache-from: type=gha,scope=aqp-api
          provenance: false

  client:
    name: aqp-client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        shell: bash
        run: |
          ref="${{ github.ref_name }}"
          sha="${{ github.sha }}"
          short_sha="${sha:0:7}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            tag="pr-${{ github.event.pull_request.number }}-$short_sha"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="$ref"
          else
            tag="$ref-$short_sha"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build + push aqp-client (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./aqp_client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aqp-client:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aqp-client:latest
          cache-from: type=gha,scope=aqp-client
          cache-to: type=gha,mode=max,scope=aqp-client
          provenance: false

  inspect:
    name: Verify multi-arch manifests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [api-and-worker, client]
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Inspect manifests
        run: |
          for image in aqp-api aqp-worker aqp-client; do
            echo "=== $image:latest ==="
            docker buildx imagetools inspect "${REGISTRY}/${IMAGE_OWNER}/$image:latest" || true
          done
