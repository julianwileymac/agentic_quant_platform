[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aqp-ingest"
version = "0.1.0"
description = "Customer-facing self-service ingestion plane for the Agentic Quant Platform — Airbyte CDK extensions, curated financial connectors (Polygon, Databento, Alpaca, IEX, Bloomberg, Refinitiv), Airbyte controller, dbt-loom registry, connector marketplace."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AQP Platform Team" }]
keywords = ["aqp", "airbyte", "ingestion", "financial-data", "elt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "pyarrow>=15.0",
    "httpx>=0.27",
    "aqp-ratelimit>=0.1.0",
]

[project.optional-dependencies]
airbyte = [
    "airbyte-cdk>=6.0",
]
databento = [
    "databento>=0.40",
]
alpaca = [
    "alpaca-py>=0.25",
]
bloomberg = [
    "blpapi>=3.24",
]
dbt-loom = [
    "dbt-loom>=0.9.4",
]
all = [
    "aqp-ingest[airbyte,databento,alpaca,dbt-loom]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/julianwiley/agentic_quant_platform"
Issues = "https://github.com/julianwiley/agentic_quant_platform/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aqp_ingest_cdk", "connectors", "controller", "marketplace", "dbt_loom"]

[tool.hatch.build.targets.sdist]
include = [
    "src/aqp_ingest_cdk",
    "connectors",
    "controller",
    "marketplace",
    "dbt_loom",
    "tasks",
    "api",
    "configs",
    "tests",
    "README.md",
    "AGENTS.md",
    "INDEX.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "N"]
