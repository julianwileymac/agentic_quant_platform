{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aqp-admin.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "aqp-admin.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "aqp-admin.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedIngressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8900
        - protocol: TCP
          port: 3003
  egress:
    # Kube DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # AWS API endpoints (interface VPC endpoints) — internal
    - to:
        - ipBlock: { cidr: 10.0.0.0/8 }
      ports:
        - protocol: TCP
          port: 443
{{- end }}
