linkerd-control-plane:
  identity:
    issuer:
      scheme: kubernetes.io/tls
      tls:
        crtPEM: ""    # populated from the ACM-PCA-issued cert
        keyPEM: ""
  proxy:
    cores: 1
    resources:
      cpu:    { request: 100m, limit: 500m }
      memory: { request: 64Mi, limit: 128Mi }
  highAvailability: true
