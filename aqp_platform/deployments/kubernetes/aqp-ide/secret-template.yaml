# Secret template — do NOT commit real secret values to git.
#
# Hard rule contract (AQP rule 26 + .cursor/rules/aqp-management-engine.mdc):
# Every secret in this namespace flows through ExternalSecret ->
# ClusterSecretStore -> Vault. Hand-pasting a token / client_id into this
# template is review-blocking.
#
# Wire the real secret via External Secrets Operator. Example:
#
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: aqp-ide-auth0
#   namespace: aqp-ide
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: aqp-vault
#     kind: ClusterSecretStore
#   target:
#     name: aqp-ide-auth0
#     creationPolicy: Owner
#   data:
#     - secretKey: AQP_THEIA_AUTH0_CLIENT_ID
#       remoteRef:
#         key: aqp/ide/auth0
#         property: spa_client_id
#
# Below is a manual stub kept commented out so `kubectl apply -k` does NOT
# materialise an empty Secret. Replace with the ExternalSecret above before
# applying in any real environment.
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: aqp-ide-auth0
#   namespace: aqp-ide
# type: Opaque
# stringData:
#   AQP_THEIA_AUTH0_CLIENT_ID: "REPLACE-VIA-EXTERNAL-SECRET"

apiVersion: v1
kind: ConfigMap
metadata:
  name: aqp-ide-secret-template-marker
  namespace: aqp-ide
data:
  README: |
    This ConfigMap exists only so kustomize has at least one resource to
    apply from secret-template.yaml. The real secret material lives in
    Vault and is projected into the namespace via an ExternalSecret named
    `aqp-ide-auth0`. See the comment block at the top of this file for
    the canonical ExternalSecret shape.
