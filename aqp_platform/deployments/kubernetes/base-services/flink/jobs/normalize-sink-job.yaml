# =============================================================================
# FlinkSessionJob - Normalize and Multi-Sink
# =============================================================================
# Consumes features.indicators.v1, z-score normalizes per symbol, and
# fans out to:
#   - Kafka features.normalized.v1
#   - PostgreSQL flink_trading.signals (via JDBC upsert)
#   - MinIO Parquet (s3://dagster-artifacts/normalized/...)
#   - VictoriaMetrics remote-write
#
# Job source: aqp_platform/flink-jobs/jobs/normalize_sink.py
# =============================================================================
apiVersion: flink.apache.org/v1beta1
kind: FlinkSessionJob
metadata:
  name: normalize-sink
  namespace: aqp-streaming
  labels:
    app: flink-trading-session
    job: normalize-sink
    pipeline-stage: normalize
spec:
  deploymentName: flink-trading-session
  job:
    jarURI: s3://flink-jobs/normalize_sink.py
    entryClass: org.apache.flink.client.python.PythonDriver
    args:
      - "--python"
      - "/opt/aqp-flink-jobs/jobs/normalize_sink.py"
      - "--pyFiles"
      - "/opt/aqp-flink-jobs/jobs"
      - "--kafka.bootstrap.servers"
      - "trading-kafka-kafka-bootstrap.aqp-streaming.svc.cluster.local:9092"
      - "--kafka.group.id"
      - "flink-normalize"
      - "--kafka.source.topic"
      - "features.indicators.v1"
      - "--kafka.sink.topic"
      - "features.normalized.v1"
      - "--postgres.url"
      - "jdbc:postgresql://postgresql.aqp-data-services.svc.cluster.local:5432/postgres"
      - "--postgres.user"
      - "postgres"
      - "--postgres.password"
      - "postgres"
      - "--s3.parquet.dir"
      - "s3://dagster-artifacts/normalized/"
      - "--vm.write.url"
      - "http://victoriametrics.aqp-observability.svc.cluster.local:8428"
      - "--window.size.seconds"
      - "60"
    parallelism: 2
    upgradeMode: savepoint
    state: suspended
