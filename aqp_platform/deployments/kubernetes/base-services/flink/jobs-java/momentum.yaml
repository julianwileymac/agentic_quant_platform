# =============================================================================
# FlinkSessionJob - Momentum (RSI, MACD, ADX, STOCH*, ROC*, WILLR, ...)
# =============================================================================
apiVersion: flink.apache.org/v1beta1
kind: FlinkSessionJob
metadata:
  name: indicators-momentum
  namespace: aqp-streaming
  labels:
    app: flink-trading-session
    job: indicators-momentum
    pipeline-stage: compute
    category: momentum
spec:
  deploymentName: flink-trading-session
  job:
    jarURI: s3://flink-jobs/java/indicators-momentum.jar
    entryClass: io.rpi.flink.indicators.momentum.MomentumJob
    args:
      - "--kafka.bootstrap.servers"
      - "trading-kafka-kafka-bootstrap.aqp-streaming.svc.cluster.local:9092"
      - "--kafka.source.topic"
      - "market.bar.v1"
      - "--kafka.sink.topic"
      - "features.indicators.v1"
      - "--kafka.group.id"
      - "flink-java-momentum"
      - "--schema.registry.url"
      - "http://apicurio-registry.aqp-streaming.svc.cluster.local:8080/apis/registry/v2"
      - "--window.size.seconds"
      - "60"
      - "--buffer.size"
      - "300"
      - "--category.label"
      - "momentum"
    parallelism: 2
    upgradeMode: savepoint
    state: suspended
