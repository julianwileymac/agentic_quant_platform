apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aqp-elt

resources:
  - rbac.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - servicemonitor.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: jupyterhub
      app.kubernetes.io/component: development
      app.kubernetes.io/part-of: rpi-k8s-platform
