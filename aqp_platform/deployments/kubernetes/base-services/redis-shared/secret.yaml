# =============================================================================
# Redis 8 Stack - Credentials
# =============================================================================
# Shared credentials for the consolidated Redis 8 Stack cache / vector store /
# agent-memory deployment. Consumed by:
#   - RAGFlow (db=1)
#   - management-api backend (cache-aside, document store, redis-admin)
#   - pipelines package (redis_io, redis_vectors, redis_cache, redis_om)
#   - Grafana redis-datasource plugin (direct-query panels)
#   - redis_exporter (Prometheus metrics)
#
# Keep `redis-password` aligned with `ragflow-secrets.redis-password` until
# both Secrets converge. See aqp_docs/docs/concepts/data/redpanda.md for
# the canonical streaming-data narrative; the legacy redis-stack migration
# note is tracked as a content debt under
# .cursor/plans/aqp-index-debt-phase-0-external-stragglers.md.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: aqp-data-services
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: rpi-k8s-platform
type: Opaque
stringData:
  password: ragflow123
  host: redis.aqp-data-services.svc.cluster.local
  port: "6379"
  url: redis://:ragflow123@redis.aqp-data-services.svc.cluster.local:6379/0
  url-om: redis://:ragflow123@redis.aqp-data-services.svc.cluster.local:6379/0
