# =============================================================================
# Alpha Vantage dedicated topics (alphavantage.*.v1)
# =============================================================================
# One topic per AV data kind. Fed by the poll-and-emit producer at
# templates/alphavantage-producer/ and by the Argo bulk-load WorkflowTemplates
# at kubernetes/mlops/pipelines/alphavantage/. Schemas live under
# flink-jobs/jobs/schemas/alphavantage/. Kept distinct from the market.*.v1
# topics so AV-specific data and the existing trading/IBKR/Alpaca streams stay
# independently evolvable.
# =============================================================================

---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: alphavantage.quote.v1
  namespace: aqp-streaming
  labels:
    strimzi.io/cluster: trading-kafka
    pipeline-stage: ingest
    schema: alphavantage_quote_v1
    data-provider: alphavantage
spec:
  partitions: 6
  replicas: 1
  config:
    retention.ms: 86400000
    segment.bytes: 268435456
    cleanup.policy: delete
    message.timestamp.type: LogAppendTime

