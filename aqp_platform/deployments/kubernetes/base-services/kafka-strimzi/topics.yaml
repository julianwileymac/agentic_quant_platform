# =============================================================================
# Kafka Topics for the AQP Streaming Pipeline
# =============================================================================
# Twelve canonical topics matching the Avro schemas in
# ``agentic_quant_platform/aqp/streaming/schemas/``. Partitioning,
# retention, and cleanup policy are tuned per-topic based on expected
# cardinality and consumer semantics:
#
#   - Raw tick streams (trade/quote): high-throughput, 1d retention.
#   - Bar / snapshot: moderate volume, 7d retention.
#   - Market metadata (contract): log-compacted, infinite retention.
#   - Scanner / imbalance / status / correction: low volume, 7d retention.
#   - Features (indicators/normalized/signals): 30d with compact+delete
#     so strategies can rewind for a month.
#   - Deadletter: 30d, append-only sink for producer failures.
#
# All topics are managed by the Strimzi Topic Operator.
# =============================================================================

---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: market.trade.v1
  namespace: aqp-streaming
  labels:
    strimzi.io/cluster: trading-kafka
    pipeline-stage: ingest
    schema: market_trade_v1
spec:
  partitions: 12
  replicas: 1
  config:
    retention.ms: 86400000
    segment.bytes: 536870912
    cleanup.policy: delete
    message.timestamp.type: LogAppendTime

