# =============================================================================
# aqp-tenant-router — cell-routing decision service.
#
# Phase 3 §6.4 (RESTRUCTURING_PLAN.md). Deployed in the ``aqp-edge``
# namespace so it sits next to ``aqp-edge`` (the Envoy that calls it
# via ext_authz) and the ``cloudflared-aqp`` tunnel.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqp-tenant-router
  namespace: aqp-edge
  labels:
    app: aqp-tenant-router
    app.kubernetes.io/name: aqp-tenant-router
    app.kubernetes.io/part-of: aqp
    app.kubernetes.io/component: cell-router
    app.kubernetes.io/managed-by: kustomize
spec:
  # Two replicas so a single restart cannot brown out the ext_authz
  # callout. Phase 5 will horizontally scale based on RPS.
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aqp-tenant-router
  template:
    metadata:
      labels:
        app: aqp-tenant-router
        app.kubernetes.io/name: aqp-tenant-router
        app.kubernetes.io/part-of: aqp
        app.kubernetes.io/component: cell-router
    spec:
      serviceAccountName: aqp-tenant-router
      automountServiceAccountToken: true  # M2M token for control-plane refresh
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aqp-tenant-router
          image: ghcr.io/julianwiley/aqp-tenant-router:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: AQP_TENANT_ROUTER_CONTROL_PLANE_URL
              value: http://aqp-cp.aqp-admin.svc.cluster.local:9000
            - name: AQP_TENANT_ROUTER_REFRESH_INTERVAL_SECONDS
              value: "30"
            - name: AQP_TENANT_ROUTER_REQUEST_TIMEOUT_SECONDS
              value: "5"
            - name: AQP_TENANT_ROUTER_M2M_TOKEN_FILE
              value: /var/run/secrets/kubernetes.io/serviceaccount/token
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 1000m
              memory: 256Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: aqp-tenant-router
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["arm64", "amd64"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aqp-tenant-router
  namespace: aqp-edge
  labels:
    app.kubernetes.io/name: aqp-tenant-router
    app.kubernetes.io/part-of: aqp
---
apiVersion: v1
kind: Service
metadata:
  name: aqp-tenant-router
  namespace: aqp-edge
  labels:
    app: aqp-tenant-router
    app.kubernetes.io/name: aqp-tenant-router
    app.kubernetes.io/part-of: aqp
spec:
  type: ClusterIP
  selector:
    app: aqp-tenant-router
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aqp-tenant-router
  namespace: aqp-edge
  labels:
    app.kubernetes.io/name: aqp-tenant-router
    app.kubernetes.io/part-of: aqp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: aqp-tenant-router
