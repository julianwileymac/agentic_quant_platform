apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aqp-edge

# AQP.FUND uses a Cloudflare-managed tunnel configuration. The token
# Secret is created out-of-band so this kustomization never commits or
# overwrites a live tunnel token. See README.md.
resources:
  - deployment.yaml
  - service.yaml

commonLabels:
  app.kubernetes.io/name: cloudflared-aqp
  app.kubernetes.io/component: tunnel
  app.kubernetes.io/part-of: aqp
  aqp.internal/canonical-owner: agentic_quant_platform
