apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# =============================================================================
# Phase 5 §8.3 (RESTRUCTURING_PLAN.md) — agent-sandbox bundle.
#
# Apply order:
#   1. gvisor/        — RuntimeClass + installer DaemonSet (cluster-wide).
#   2. pool/          — aqp-agent-sandbox-pool Deployment (per-cell).
#
# gVisor MUST be installed BEFORE the pool because the Pool's
# scheduler waits for nodes labelled `aqp.io/gvisor=installed`.
# =============================================================================
resources:
  - gvisor/
  - pool/
