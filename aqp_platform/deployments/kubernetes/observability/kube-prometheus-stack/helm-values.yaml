# Helm values for the kube-prometheus-stack chart. Consumed by
# aqp_platform/scripts/cluster_install/install-kube-prometheus-stack.sh (generated
# in Phase 5) which wraps `helm upgrade --install`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-prometheus-stack-values
  namespace: aqp-observability
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: aqp
data:
  values.yaml: |
    # The chart deploys Prometheus, Grafana, kube-state-metrics,
    # node-exporter, alertmanager. Phase 2c configuration.
    fullnameOverride: kube-prom

    prometheus:
      prometheusSpec:
        retention: 14d
        retentionSize: 40GB
        scrapeInterval: 15s
        evaluationInterval: 15s
        # Discovery selectors. Empty selectors mean the operator picks
        # up every ServiceMonitor / PodMonitor / PrometheusRule labeled
        # release: kube-prometheus-stack across cluster scope.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: aqp-ssd
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 100Gi
        # Phase 4 portal cutover: NetworkPolicy on the `web` namespace
        # allows egress to this Service.
        externalUrl: https://prometheus.aqp.fund

    alertmanager:
      enabled: true
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: aqp-ssd
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 5Gi

    grafana:
      enabled: true
      adminPassword: changeme  # rotated via the auth0 / vault flow
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
          label: grafana_dashboard
        datasources:
          enabled: true
          searchNamespace: ALL
          label: grafana_datasource
      grafana.ini:
        server:
          domain: grafana.aqp.fund
          root_url: https://grafana.aqp.fund
        auth.generic_oauth:
          enabled: true
          name: Auth0
          allow_sign_up: true
          client_id: ${AQP_AUTH_OIDC_CLIENT_ID}
          client_secret: ${AQP_AUTH_OIDC_CLIENT_SECRET}
          scopes: openid email profile
          auth_url: https://aqp-fund.us.auth0.com/authorize
          token_url: https://aqp-fund.us.auth0.com/oauth/token
          api_url: https://aqp-fund.us.auth0.com/userinfo
          allowed_domains: aqp.fund
        users:
          auto_assign_org_role: Editor
      service:
        type: ClusterIP
      persistence:
        enabled: true
        storageClassName: aqp-ssd
        size: 10Gi

    kube-state-metrics:
      enabled: true

    nodeExporter:
      enabled: true

    prometheusOperator:
      enabled: true
      admissionWebhooks:
        certManager:
          enabled: false
        autoGenerateCert:
          enabled: true
