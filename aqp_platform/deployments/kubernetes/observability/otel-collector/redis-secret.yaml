# =============================================================================
# Redis credentials mirror for OTel Collector
# =============================================================================
# The canonical Redis credentials live in
# kubernetes/base-services/redis/secret.yaml (namespace: aqp-data-services).
# Kubernetes does not allow cross-namespace Secret references, so this
# mirror Secret is applied alongside the Collector DaemonSet.  The value
# MUST stay in sync with base-services/redis/secret.yaml.
#
# If you prefer automated sync, point the External Secrets Operator at
# the primary Secret and remove this file.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: aqp-observability
  labels:
    app: otel-collector
    app.kubernetes.io/component: metrics-exporter
    compat: redis-password-mirror
type: Opaque
stringData:
  password: ragflow123
