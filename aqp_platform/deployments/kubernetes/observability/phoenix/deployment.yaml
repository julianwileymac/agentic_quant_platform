apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: phoenix-data
  namespace: aqp-observability
  labels:
    app.kubernetes.io/part-of: aqp
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: aqp-ssd
  resources:
    requests:
      storage: 16Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: aqp-observability
  labels:
    app.kubernetes.io/name: phoenix
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: aqp
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: phoenix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phoenix
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: aqp
    spec:
      initContainers:
        - name: phoenix-db-migrate
          image: arizephoenix/phoenix:latest
          command: ["phoenix", "db", "migrate"]
          env:
            - name: PHOENIX_SQL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: phoenix-db-secret
                  key: url
      containers:
        - name: phoenix
          image: arizephoenix/phoenix:latest
          command: ["phoenix", "serve"]
          ports:
            - name: ui-http
              containerPort: 6006
              protocol: TCP
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
          env:
            - name: PHOENIX_SQL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: phoenix-db-secret
                  key: url
            - name: PHOENIX_DEFAULT_RETENTION_POLICY_DAYS
              value: "30"
            - name: PHOENIX_ALLOW_EXTERNAL_RESOURCES
              value: "false"
          volumeMounts:
            - name: phoenix-data
              mountPath: /var/lib/phoenix/data
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /metrics
              port: ui-http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: ui-http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: phoenix-data
          persistentVolumeClaim:
            claimName: phoenix-data
