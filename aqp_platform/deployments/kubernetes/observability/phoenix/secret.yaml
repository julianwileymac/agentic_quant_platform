# PLACEHOLDER secret. Replace `password` value with a strong random
# string before applying via:
#   kubectl -n aqp-observability create secret generic phoenix-db-secret \
#     --from-literal=url='postgresql://phoenix:<password>@phoenix-postgresql.aqp-observability.svc.cluster.local:5432/phoenix' \
#     --from-literal=password='<password>' \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: phoenix-db-secret
  namespace: aqp-observability
  labels:
    app.kubernetes.io/part-of: aqp
type: Opaque
stringData:
  url: "postgresql://phoenix:REPLACE_ME@phoenix-postgresql.aqp-observability.svc.cluster.local:5432/phoenix"
---
apiVersion: v1
kind: Secret
metadata:
  name: phoenix-postgresql
  namespace: aqp-observability
  labels:
    app.kubernetes.io/part-of: aqp
type: Opaque
stringData:
  password: "REPLACE_ME"
