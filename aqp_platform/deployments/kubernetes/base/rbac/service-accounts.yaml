---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aqp-client
  namespace: aqp
  labels:
    app.kubernetes.io/name: aqp-client
    app.kubernetes.io/part-of: aqp
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aqp-core
  namespace: aqp
  labels:
    app.kubernetes.io/name: aqp-core
    app.kubernetes.io/part-of: aqp
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aqp-worker
  namespace: aqp
  labels:
    app.kubernetes.io/name: aqp-worker
    app.kubernetes.io/part-of: aqp
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aqp-cp
  namespace: aqp-admin
  labels:
    app.kubernetes.io/name: aqp-cp
    app.kubernetes.io/part-of: aqp
# The control plane needs the projected token to call the Kubernetes API
# via the KubernetesProvider — it's the only AQP ServiceAccount that
# does so.
automountServiceAccountToken: true
