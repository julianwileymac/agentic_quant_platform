# aqp-ui runtime secrets, synced from HashiCorp Vault via
# External Secrets Operator.
#
# AGENTS rule 3 (aqp-platform.mdc): CredentialResolver is the only
# credential surface. Secrets NEVER appear inline in this repo.
#
# Vault paths:
#   secret/data/aqp-ui/auth0  -> client_id, client_secret, secret, audience, domain
#   secret/data/aqp-ui/entra  -> client_id, client_secret, tenant_id
#   secret/data/aqp-ui/session -> session_secret (32-byte hex)
#
# The mapping below flattens each Vault entry into individual K8s
# Secret keys consumed by the Deployment's `envFrom: secretRef:`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aqp-ui-secrets
  namespace: aqp-ui
  labels:
    app.kubernetes.io/part-of: aqp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aqp-secret-store
    kind: ClusterSecretStore
  target:
    name: aqp-ui-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    # Auth0 — B2C self-signup
    - secretKey: AUTH0_DOMAIN
      remoteRef:
        key: aqp-ui/auth0
        property: domain
    - secretKey: AUTH0_CLIENT_ID
      remoteRef:
        key: aqp-ui/auth0
        property: client_id
    - secretKey: AUTH0_CLIENT_SECRET
      remoteRef:
        key: aqp-ui/auth0
        property: client_secret
    - secretKey: AUTH0_AUDIENCE
      remoteRef:
        key: aqp-ui/auth0
        property: audience
    - secretKey: AUTH0_SECRET
      remoteRef:
        key: aqp-ui/auth0
        property: secret
    # Auth0 Management API (M2M)
    - secretKey: AUTH0_MGMT_API_AUDIENCE
      remoteRef:
        key: aqp-ui/auth0
        property: mgmt_audience
    - secretKey: AUTH0_MGMT_API_CLIENT_ID
      remoteRef:
        key: aqp-ui/auth0
        property: mgmt_client_id
    - secretKey: AUTH0_MGMT_API_CLIENT_SECRET
      remoteRef:
        key: aqp-ui/auth0
        property: mgmt_client_secret
    # Entra ID — B2B enterprise SSO
    - secretKey: ENTRA_TENANT_ID
      remoteRef:
        key: aqp-ui/entra
        property: tenant_id
    - secretKey: ENTRA_CLIENT_ID
      remoteRef:
        key: aqp-ui/entra
        property: client_id
    - secretKey: ENTRA_CLIENT_SECRET
      remoteRef:
        key: aqp-ui/entra
        property: client_secret
    - secretKey: ENTRA_AUTHORITY
      remoteRef:
        key: aqp-ui/entra
        property: authority
    - secretKey: ENTRA_REDIRECT_URI
      remoteRef:
        key: aqp-ui/entra
        property: redirect_uri
    # Unified session JWE key (32-byte AES-256-GCM, hex-encoded)
    - secretKey: AQP_UI_SESSION_SECRET
      remoteRef:
        key: aqp-ui/session
        property: session_secret
