apiVersion: v1
kind: ServiceAccount
metadata:
  name: aqp-ui
  namespace: aqp-ui
  labels:
    app: aqp-ui
    app.kubernetes.io/name: aqp-ui
    app.kubernetes.io/part-of: aqp
    app.kubernetes.io/component: frontend
# automountServiceAccountToken is disabled on the Pod template; this
# ServiceAccount exists for ExternalSecret SPIFFE auth + Vault
# kubernetes auth method bindings only.
automountServiceAccountToken: false
