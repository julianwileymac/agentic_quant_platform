# =============================================================================
# SPIRE Agent — node-local SVID dispenser.
#
# Phase 4 §7.2 (RESTRUCTURING_PLAN.md). DaemonSet pinning one Agent
# per node. Exposes the SPIFFE Workload API on
# `/run/spire/sockets/agent.sock`; every AQP workload pod that mounts
# the matching `hostPath` reads its JWT-SVID via that socket.
#
# The Workload Attestor reads node-level state to attest the
# workload's identity (UID, cgroup, label selectors). This means the
# Agent itself runs as a node-level process — hence the privileged
# host-mount pattern documented in `namespace.yaml`.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-agent
  namespace: spire-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-agent-cluster-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-agent-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spire-agent-cluster-role
subjects:
  - kind: ServiceAccount
    name: spire-agent
    namespace: spire-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent-config
  namespace: spire-system
data:
  agent.conf: |
    agent {
      data_dir = "/run/spire/data"
      log_level = "INFO"
      server_address = "spire-server"
      server_port = "8081"
      socket_path = "/run/spire/sockets/agent.sock"
      trust_bundle_path = "/run/spire/bundle/bundle.crt"
      trust_domain = "aqp.fund"
    }

    plugins {
      NodeAttestor "k8s_psat" {
        plugin_data {
          cluster = "aqp"
        }
      }
      KeyManager "memory" {}
      WorkloadAttestor "k8s" {
        plugin_data {
          skip_kubelet_verification = true
        }
      }
      WorkloadAttestor "unix" {}
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spire-agent
  namespace: spire-system
  labels:
    app: spire-agent
    app.kubernetes.io/part-of: aqp
spec:
  selector:
    matchLabels:
      app: spire-agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: spire-agent
    spec:
      serviceAccountName: spire-agent
      hostNetwork: false
      hostPID: true  # Needed by the Workload Attestor to attest cgroup state.
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: init
          image: cgr.dev/chainguard/wait-for-it:latest
          command: ["/wait-for-it"]
          args: ["-t", "30", "spire-server:8081"]
      containers:
        - name: spire-agent
          image: ghcr.io/spiffe/spire-agent:1.10.4
          args:
            - -config
            - /run/spire/config/agent.conf
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /run/spire/config
              readOnly: true
            - name: bundle
              mountPath: /run/spire/bundle
              readOnly: true
            - name: agent-socket
              mountPath: /run/spire/sockets
            - name: spire-data
              mountPath: /run/spire/data
      volumes:
        - name: config
          configMap:
            name: spire-agent-config
        - name: bundle
          configMap:
            name: spire-bundle
        - name: agent-socket
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: spire-data
          emptyDir: {}
