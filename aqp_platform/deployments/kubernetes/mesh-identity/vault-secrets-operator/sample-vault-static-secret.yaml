# =============================================================================
# Sample VaultStaticSecret — projects cell Postgres credentials.
#
# Phase 4 §7.6 (RESTRUCTURING_PLAN.md). This file is a TEMPLATE that
# cell overlays at
# `aqp_platform/deployments/kubernetes/cells/<cell-id>/vault-operator/`
# override. The Phase 4 spine ships ONE sample (cell-shared-std-local)
# so operators have a working reference; Phase 4.5 fills in the
# full per-cell set across every persistent service.
# =============================================================================
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: aqp-cell-vault
  namespace: cell-shared-std-local
spec:
  # Operators override per cell. Default points at the in-cluster
  # Vault that ships under aqp_platform/deployments/kubernetes/
  # base-services/hashicorp-vault/ (added in Phase 4.5).
  address: "https://vault.aqp-data-services.svc.cluster.local:8200"
  skipTLSVerify: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: aqp-cell-vault-auth
  namespace: cell-shared-std-local
spec:
  vaultConnectionRef: aqp-cell-vault
  method: kubernetes
  mount: kubernetes-cells
  kubernetes:
    role: cell-shared-std-local
    serviceAccount: aqp-core
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: aqp-cell-postgres-credentials
  namespace: cell-shared-std-local
  labels:
    app.kubernetes.io/part-of: aqp
    aqp.io/cell-id: cell-shared-std-local
spec:
  vaultAuthRef: aqp-cell-vault-auth
  mount: cells/shared-std/postgres
  path: cell-shared-std-local
  destination:
    create: true
    name: postgres-credentials
  refreshAfter: 30m
  rolloutRestartTargets:
    - kind: Deployment
      name: aqp-core
    - kind: Deployment
      name: aqp-worker
