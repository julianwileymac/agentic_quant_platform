# =============================================================================
# HashiCorp vault-secrets-operator (VSO) install.
#
# Phase 4 §7.6 (RESTRUCTURING_PLAN.md). VSO watches Vault KV v2 paths
# and projects them as standard Kubernetes Secrets via four CRDs:
#
#   - VaultConnection      — Vault cluster endpoint + TLS material.
#   - VaultAuth            — auth method (Kubernetes / AppRole / JWT).
#   - VaultStaticSecret    — KV v2 path -> Kubernetes Secret.
#   - VaultDynamicSecret   — dynamic engine -> Kubernetes Secret.
#
# AQP wires the projected Secrets into the consumer pods via
# `envFrom: secretRef` or mounted volumes. The matching Python store
# is `aqp.credentials.stores.vault_static_secret_store.VaultStaticSecretStore`.
# =============================================================================
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault-secrets-operator
  namespace: vault-secrets-operator
spec:
  releaseName: vault-secrets-operator
  interval: 1h
  chart:
    spec:
      chart: vault-secrets-operator
      version: "0.10.x"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
  values:
    # Default Vault connection. Operators override per cell via the
    # per-cell `VaultConnection` CRD below.
    defaultVaultConnection:
      enabled: false
    defaultAuthMethod:
      enabled: false

    # Run as nonroot UID 65532 to match the Phase 2 §5.4 convention.
    controller:
      manager:
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 65532
          fsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: hashicorp
  namespace: vault-secrets-operator
spec:
  interval: 1h
  url: https://helm.releases.hashicorp.com
