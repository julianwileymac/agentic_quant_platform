apiVersion: v1
kind: Namespace
metadata:
  name: cell-silo-reg-acme
  labels:
    app.kubernetes.io/part-of: aqp
    app.kubernetes.io/managed-by: kustomize
    # Phase 3 §6.5 — cell metadata labels (mirrors the cells registry).
    aqp.io/component: aqp-cell
    aqp.io/cell-id: cell-silo-reg-acme
    aqp.io/cell-tier: silo-reg
    aqp.io/cell-region: us-east-1
    aqp.io/cell-availability-zone: us-east-1a
    aqp.io/tenancy-strategy: database_per_enterprise
    aqp.io/pinned-tenant: tenant_acme
    # Phase 2 §5.4 — PSS restricted with version pins.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    # Phase 2 §5.3 — FinOps governance labels.
    project: aqp-cell-silo-reg-acme
    cost_center: acme-dedicated
    owner: platform-engineering
    data_classification: customer-pii
  annotations:
    # Phase 4 §7.1 (RESTRUCTURING_PLAN.md) — enrol every workload
    # in this namespace into the per-cell Linkerd mesh. Linkerd's
    # Proxy Injector watches for this annotation; pods inherit.
    linkerd.io/inject: enabled
    aqp.internal/description: "Phase 3 §6.5 worked-example silo-reg cell (tenant_acme). FINRA / ISO 27001 posture per the §6.1 cell mapping."
