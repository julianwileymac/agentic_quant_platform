# =============================================================================
# Alpha Vantage API token secret (mlops namespace copy)
# =============================================================================
# The backing value is populated by `bootstrap/scripts/install-alphavantage.sh`
# from the local token file. Tracked in-repo with a placeholder so `kubectl
# apply -k` succeeds; the install script does a `kubectl create secret ...
# --dry-run=client -o yaml | kubectl apply -f -` to overwrite with the real
# token before any workflow references it.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: alphavantage-credentials
  namespace: aqp-mlops
  labels:
    app.kubernetes.io/name: alphavantage-credentials
    app.kubernetes.io/part-of: rpi-k8s-platform
    data-provider: alphavantage
type: Opaque
stringData:
  # Replace this placeholder via `bootstrap/scripts/install-alphavantage.sh`.
  api-key: "REPLACE_ME"
