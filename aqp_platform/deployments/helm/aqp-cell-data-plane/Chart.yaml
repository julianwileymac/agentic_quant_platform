apiVersion: v2
name: aqp-cell-data-plane
description: >-
  Phase 6 §9 (RESTRUCTURING_PLAN.md) — per-cell data plane bundle.
  One Helm release per cell ships CNPG Postgres, Redis, MinIO,
  MLflow, and an Iceberg REST catalog scoped to the cell. Argo CD's
  cells `ApplicationSet` stamps the release with cell-specific
  values. §9.6 per-cell Kafka is deferred until the first silo-reg
  tenant requests it.
type: application
