{{- if .Values.redis.enabled -}}
# =============================================================================
# Phase 6 §9.4 — per-cell Redis.
#
# Phase 6 ships the simple StatefulSet shape for `shared-std` cells
# (single replica). `shared-prem` and `silo-reg` set
# `redis.mode: sentinel` and the operator pairs this template with
# Bitnami's Sentinel chart via a separate HelmRelease (Phase 6.5).
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: aqp-cell-redis-config
  labels:
{{ include "aqp-cell-data-plane.labels" . | indent 4 }}
    aqp.io/datastore: redis
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode no
    port 6379
    appendonly yes
    appendfsync everysec
    # Phase 4 §7.1 — Linkerd mTLS makes the in-cluster traffic safe;
    # no AUTH password here (the credentials come from a Phase 4 §7.6
    # VaultStaticSecret-projected Secret for application-level auth).
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aqp-cell-redis
  labels:
{{ include "aqp-cell-data-plane.labels" . | indent 4 }}
    aqp.io/datastore: redis
spec:
  serviceName: aqp-cell-redis
  replicas: 1
  selector:
    matchLabels:
      app: aqp-cell-redis
  template:
    metadata:
      labels:
        app: aqp-cell-redis
{{ include "aqp-cell-data-plane.labels" . | indent 8 }}
      annotations:
{{ include "aqp-cell-data-plane.podAnnotations" . | indent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001  # Bitnami images use 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          command: ["redis-server", "/etc/redis/redis.conf"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/redis
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: aqp-cell-redis-config
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.redis.storageClassName }}
        storageClassName: {{ .Values.redis.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.storage | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: aqp-cell-redis
  labels:
{{ include "aqp-cell-data-plane.labels" . | indent 4 }}
    aqp.io/datastore: redis
spec:
  type: ClusterIP
  selector:
    app: aqp-cell-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
