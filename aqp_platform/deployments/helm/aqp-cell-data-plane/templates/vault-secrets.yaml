{{- /*
=============================================================================
Phase 6 §9 + Phase 4 §7.6 — per-cell Vault-backed credentials.

Every data-plane workload in the cell reads its credentials from a
Secret that the `vault-secrets-operator` materialises from a
per-cell Vault path. The Secrets are NEVER hand-managed — Helm
emits the `VaultStaticSecret` (or `VaultDynamicSecret`) CR and the
operator owns the underlying `Secret` object.

The Vault path convention is documented in
aqp_docs/docs/how-to/cell-data-plane-migration.md §"Vault paths".
The default path is `secret/aqp/cells/{cell_id}/<service>`.
============================================================================= */ -}}
{{- $cellId := .Values.cell_id -}}
{{- $vaultBasePath := printf "secret/aqp/cells/%s" $cellId -}}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: aqp-cell-postgres-credentials
  labels:
{{ include "aqp-cell-data-plane.labels" . | indent 4 }}
spec:
  type: kv-v2
  mount: secret
  path: aqp/cells/{{ $cellId }}/postgres
  refreshAfter: 60s
  destination:
    name: aqp-cell-postgres-credentials
    create: true
    # CNPG superuser Secret keys: `username` + `password`.
    transformation:
      templates:
        username:
          text: "{{`{{- get .Secrets \"username\" -}}`}}"
        password:
          text: "{{`{{- get .Secrets \"password\" -}}`}}"
  vaultAuthRef: aqp-cell-vault-auth
---
{{- if .Values.minio.enabled }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: aqp-cell-minio-credentials
  labels:
{{ include "aqp-cell-data-plane.labels" . | indent 4 }}
spec:
  type: kv-v2
  mount: secret
  path: aqp/cells/{{ $cellId }}/minio
  refreshAfter: 60s
  destination:
    name: aqp-cell-minio-credentials
    create: true
    transformation:
      templates:
        # MinIO server reads MINIO_ROOT_USER / MINIO_ROOT_PASSWORD.
        MINIO_ROOT_USER:
          text: "{{`{{- get .Secrets \"access_key\" -}}`}}"
        MINIO_ROOT_PASSWORD:
          text: "{{`{{- get .Secrets \"secret_key\" -}}`}}"
        # mc client / S3 clients read access_key + secret_key.
        access_key:
          text: "{{`{{- get .Secrets \"access_key\" -}}`}}"
        secret_key:
          text: "{{`{{- get .Secrets \"secret_key\" -}}`}}"
  vaultAuthRef: aqp-cell-vault-auth
---
{{- end }}
{{- if .Values.mlflow.enabled }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: aqp-cell-mlflow-backend
  labels:
{{ include "aqp-cell-data-plane.labels" . | indent 4 }}
spec:
  type: kv-v2
  mount: secret
  path: aqp/cells/{{ $cellId }}/mlflow
  refreshAfter: 60s
  destination:
    name: aqp-cell-mlflow-backend
    create: true
    transformation:
      templates:
        # MLflow expects a SQLAlchemy DSN.
        dsn:
          text: "{{`{{- get .Secrets \"dsn\" -}}`}}"
  vaultAuthRef: aqp-cell-vault-auth
---
{{- end }}
{{- if .Values.icebergRest.enabled }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: aqp-cell-iceberg-backend
  labels:
{{ include "aqp-cell-data-plane.labels" . | indent 4 }}
spec:
  type: kv-v2
  mount: secret
  path: aqp/cells/{{ $cellId }}/iceberg
  refreshAfter: 60s
  destination:
    name: aqp-cell-iceberg-backend
    create: true
    transformation:
      templates:
        jdbc_uri:
          text: "{{`{{- get .Secrets \"jdbc_uri\" -}}`}}"
        username:
          text: "{{`{{- get .Secrets \"username\" -}}`}}"
        password:
          text: "{{`{{- get .Secrets \"password\" -}}`}}"
  vaultAuthRef: aqp-cell-vault-auth
{{- end }}
