{{- range $kind := list "data" "codebase" -}}
{{- $ctx := dict "kind" $kind "Values" $.Values "Release" $.Release "Chart" $.Chart "Files" $.Files "Template" $.Template -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aqp-mcp-tenant.fullname" $ctx }}
  labels:
{{ include "aqp-mcp-tenant.labels" $ctx | indent 4 }}
    aqp.io/mcp-kind: {{ $kind | quote }}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
{{ include "aqp-mcp-tenant.selector" $ctx | indent 6 }}
  template:
    metadata:
      labels:
{{ include "aqp-mcp-tenant.labels" $ctx | indent 8 }}
{{ include "aqp-mcp-tenant.selector" $ctx | indent 8 }}
        aqp.io/mcp-kind: {{ $kind | quote }}
      annotations:
        linkerd.io/inject: {{ $.Values.linkerdInject | quote }}
        aqp.io/snapshot-tool-versions-on-boot: {{ $.Values.snapshotToolVersionsOnBoot | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: "{{ (index $.Values.images $kind).repository }}:{{ (index $.Values.images $kind).tag }}"
          imagePullPolicy: {{ (index $.Values.images $kind).pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $.Values.mcpPort }}
              protocol: TCP
          env:
            - name: AQP_CELL_ID
              value: {{ $.Values.cell_id | quote }}
            - name: AQP_TENANT_ID
              value: {{ $.Values.tenant_id | quote }}
            - name: AQP_MCP_KIND
              value: {{ $kind | quote }}
            - name: AQP_MCP_AUDIENCE
              # Phase 5 §8.1 — audience claim per Rule 49.
              value: "https://api.aqp.internal/mcp/{{ $kind }}/{{ $.Values.tenant_id }}/{{ $.Values.cell_id }}"
            {{- if $.Values.spiffe.enabled }}
            - name: SPIFFE_ENDPOINT_SOCKET
              value: "unix://{{ $.Values.spiffe.socketPath }}/agent.sock"
            {{- end }}
            {{- if $.Values.snapshotToolVersionsOnBoot }}
            - name: AQP_MCP_SNAPSHOT_TOOL_VERSIONS_ON_BOOT
              value: "true"
            {{- end }}
          {{- if $.Values.vaultStaticSecret.enabled }}
          envFrom:
            - secretRef:
                name: "{{ $.Values.vaultStaticSecret.secretName }}-{{ $.Values.tenant_id }}"
                optional: true
          {{- end }}
          resources:
            requests:
              cpu: {{ (index $.Values.resources $kind).requests.cpu | quote }}
              memory: {{ (index $.Values.resources $kind).requests.memory | quote }}
            limits:
              cpu: {{ (index $.Values.resources $kind).limits.cpu | quote }}
              memory: {{ (index $.Values.resources $kind).limits.memory | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $.Values.spiffe.enabled }}
            - name: spiffe-socket
              mountPath: {{ $.Values.spiffe.socketPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $.Values.spiffe.enabled }}
        - name: spiffe-socket
          hostPath:
            path: {{ $.Values.spiffe.socketPath }}
            type: DirectoryOrCreate
        {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["arm64", "amd64"]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aqp-mcp-tenant.fullname" $ctx }}
  labels:
{{ include "aqp-mcp-tenant.labels" $ctx | indent 4 }}
    aqp.io/mcp-kind: {{ $kind | quote }}
spec:
  type: ClusterIP
  selector:
{{ include "aqp-mcp-tenant.selector" $ctx | indent 4 }}
  ports:
    - name: http
      port: {{ $.Values.mcpPort }}
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "aqp-mcp-tenant.fullname" $ctx }}
spec:
  minAvailable: 0  # single-replica per-tenant — outage acceptable on rotation
  selector:
    matchLabels:
{{ include "aqp-mcp-tenant.selector" $ctx | indent 6 }}
{{- end }}
