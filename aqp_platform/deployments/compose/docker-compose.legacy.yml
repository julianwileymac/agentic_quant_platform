# =============================================================================
# AQP docker-compose — LEGACY rollback profile.
# Brings up the Next.js webui (port 3000) + Solara UI (port 8765) standalone
# for users who need to fall back. The canonical UI is the Vite app shipped
# inside the aqp_client image.
#
# Usage:
#   docker compose \
#     -f aqp_platform/deployments/compose/docker-compose.base.yml \
#     -f aqp_platform/deployments/compose/docker-compose.legacy.yml \
#     --env-file aqp_platform/deployments/compose/.env.local \
#     --profile legacy up -d
# =============================================================================
services:
  aqp-solara-legacy:
    image: ghcr.io/julianwiley/aqp-api:${AQP_APP_VERSION:-dev}
    profiles: ["legacy"]
    command: ["aqp", "ui"]
    env_file:
      - .env.local
    ports:
      - "8765:8765"
    networks:
      - aqp-internal

  aqp-webui-legacy:
    image: ghcr.io/julianwiley/aqp-webui:${AQP_APP_VERSION:-dev}
    profiles: ["legacy"]
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_AQP_API_BASE_URL: http://aqp-core:8000
    networks:
      - aqp-internal
