# =============================================================================
# Phase 3 §6.2 (RESTRUCTURING_PLAN.md) — Cell registry bootstrap seed.
#
# A "cell" is the deployment-layer unit that composes with the
# application-layer ``TenancyStrategy``. The mapping (from §6.1):
#
#   shared-std    -> shared_schema_rls         (one ns, many tenants, RLS)
#   shared-prem   -> schema_per_tenant         (one ns, one schema/tenant)
#   silo-reg      -> database_per_enterprise   (one ns, one tenant, own DB)
#   silo-custom   -> hybrid                    (per-contract)
#
# This list is the BOOTSTRAP SEED. Once the control plane has the
# ``cells`` table populated via Alembic 0082, live updates flow
# through the ``/manage/cells/*`` routes. Reseeding the YAML is the
# disaster-recovery path; the ORM table is the source of truth in
# normal operation.
#
# Cells in ``provisioning`` state are visible to the cell-router for
# health checks but not for tenant placement. ``active`` cells accept
# new tenants up to ``capacity_max_tenants``. ``draining`` cells stop
# accepting new tenants and migrate existing ones to a sibling cell.
# =============================================================================
cells:
  # Default development cell — runs the existing single-namespace
  # shared deployment as the canonical ``cell-shared-std-local`` so
  # everything you build today is already cell-addressable.
  - id: cell-shared-std-local
    tier: shared-std
    tenancy_strategy: shared_schema_rls
    region: local
    availability_zone: local-1
    k8s_namespace: aqp
    capacity_max_tenants: 100
    state: active
    routes:
      api: http://localhost:8000
      ws: ws://localhost:8000/ws
    labels:
      aqp.io/cell-tier: shared-std
      aqp.io/cell-region: local
    annotations:
      aqp.internal/description: "Default local-dev cell mapped to the existing 'aqp' namespace."

  # Phase 3 §6.5 worked example: AWS us-east-1a shared-std cell.
  # Not yet provisioned in any environment — defined here so the
  # ``aqp_platform/deployments/kubernetes/cells/shared-std-us-east-1a/``
  # overlay tree has a referent.
  - id: cell-shared-std-us-east-1a
    tier: shared-std
    tenancy_strategy: shared_schema_rls
    region: us-east-1
    availability_zone: us-east-1a
    k8s_namespace: cell-shared-std-us-east-1a
    capacity_max_tenants: 5000
    # Phase G of the AWS hybrid rollout — promoted from
    # ``provisioning`` to ``active`` once the matching
    # ``aqp_platform/terraform/environments/live/`` apply landed and
    # the EKS cluster + ECS Fargate + Bedrock AgentCore stacks reported
    # healthy. The annotation below tracks the matching commit.
    state: active
    target: aws  # binds the cell to the ``targets.aws`` entry
    routes:
      api: https://us-east-1a.shared-std.aqp.fund
      ws: wss://us-east-1a.shared-std.aqp.fund/ws
    # Phase 6 §9 — per-cell data plane. The cell-data-plane Helm chart
    # stamps these endpoints; the application reads them via
    # RequestContext.cell_id.
    data_plane:
      postgres_dsn_secret: secret/aqp/cells/cell-shared-std-us-east-1a/postgres
      redis_url: redis://aqp-cell-redis.cell-shared-std-us-east-1a.svc.cluster.local:6379/0
      minio_endpoint: http://aqp-cell-minio.cell-shared-std-us-east-1a.svc.cluster.local:9000
      minio_bucket_prefix: aqp-cell-shared-std-us-east-1a
      mlflow_tracking_uri: http://aqp-cell-mlflow.cell-shared-std-us-east-1a.svc.cluster.local:5000
      iceberg_rest_uri: http://aqp-cell-iceberg-rest.cell-shared-std-us-east-1a.svc.cluster.local:8181
      iceberg_warehouse_uri: s3://aqp-cell-shared-std-us-east-1a-warehouse/
      vault_transit_key: aqp-cell-shared-std-us-east-1a
    labels:
      aqp.io/cell-tier: shared-std
      aqp.io/cell-region: us-east-1
    annotations:
      aqp.internal/description: "AWS us-east-1a shared-std cell (Phase 3 worked example, not yet active)."

  - id: cell-shared-prem-us-east-1a
    tier: shared-prem
    tenancy_strategy: schema_per_tenant
    region: us-east-1
    availability_zone: us-east-1a
    k8s_namespace: cell-shared-prem-us-east-1a
    capacity_max_tenants: 200
    state: provisioning
    routes:
      api: https://us-east-1a.shared-prem.aqp.fund
      ws: wss://us-east-1a.shared-prem.aqp.fund/ws
    data_plane:
      postgres_dsn_secret: secret/aqp/cells/cell-shared-prem-us-east-1a/postgres
      redis_url: redis://aqp-cell-redis.cell-shared-prem-us-east-1a.svc.cluster.local:6379/0
      minio_endpoint: http://aqp-cell-minio.cell-shared-prem-us-east-1a.svc.cluster.local:9000
      minio_bucket_prefix: aqp-cell-shared-prem-us-east-1a
      mlflow_tracking_uri: http://aqp-cell-mlflow.cell-shared-prem-us-east-1a.svc.cluster.local:5000
      iceberg_rest_uri: http://aqp-cell-iceberg-rest.cell-shared-prem-us-east-1a.svc.cluster.local:8181
      iceberg_warehouse_uri: s3://aqp-cell-shared-prem-us-east-1a-warehouse/
      vault_transit_key: aqp-cell-shared-prem-us-east-1a
    labels:
      aqp.io/cell-tier: shared-prem
      aqp.io/cell-region: us-east-1
    annotations:
      aqp.internal/description: "AWS us-east-1a shared-prem cell (Phase 3 worked example)."

  - id: cell-silo-reg-acme
    tier: silo-reg
    tenancy_strategy: database_per_enterprise
    region: us-east-1
    availability_zone: us-east-1a
    k8s_namespace: cell-silo-reg-acme
    capacity_max_tenants: 1
    state: provisioning
    pinned_tenants:
      - tenant_acme
    routes:
      api: https://acme.silo-reg.aqp.fund
      ws: wss://acme.silo-reg.aqp.fund/ws
    # silo-reg cells MUST set vault_transit_key per Phase 6 §9.7 — the
    # cryptographic data-plane separation is the FINRA / ISO 27001 lever.
    data_plane:
      postgres_dsn_secret: secret/aqp/cells/cell-silo-reg-acme/postgres
      redis_url: redis://aqp-cell-redis.cell-silo-reg-acme.svc.cluster.local:6379/0
      minio_endpoint: http://aqp-cell-minio.cell-silo-reg-acme.svc.cluster.local:9000
      minio_bucket_prefix: aqp-cell-silo-reg-acme
      mlflow_tracking_uri: http://aqp-cell-mlflow.cell-silo-reg-acme.svc.cluster.local:5000
      iceberg_rest_uri: http://aqp-cell-iceberg-rest.cell-silo-reg-acme.svc.cluster.local:8181
      iceberg_warehouse_uri: s3://aqp-cell-silo-reg-acme-warehouse/
      vault_transit_key: aqp-cell-silo-reg-acme
    labels:
      aqp.io/cell-tier: silo-reg
      aqp.io/cell-region: us-east-1
    annotations:
      aqp.internal/description: "Dedicated silo-reg cell for the Acme tenant (Phase 3 worked example; FINRA / ISO 27001 posture)."
