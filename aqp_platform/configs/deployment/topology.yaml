  # ---------------------------------------------------------------------------
  # Single-account minimum deployment target (~$140/mo fixed). Skips
  # EKS / MSK / AgentCore / KB / CloudFront / EventBridge SFN. Use as a
  # stepping-stone before promoting to the full ``aws`` target below.
  # ---------------------------------------------------------------------------
  aws-minimum:
    id: aws-minimum
    label: AWS single-account minimum (~$140/mo)
    kind: aws
    environment: minimum
    cloud_provider: aws
    namespace: aqp
    adapter_preference:
      - aws_eks      # only here so the operator can still attach an EKS
                     # cluster later without retargeting; the minimum env
                     # itself doesn't provision one
      - in_cluster
    terraform:
      stack_slug: aqp-minimum
      spec_path: aqp_platform/configs/terraform/minimum.yaml
      environment_dir: aqp_platform/terraform/environments/minimum
      tfvars_path: aqp_platform/terraform/environments/minimum/terraform.tfvars
      backend_state_path: hydrate://ssm/aqp/minimum/tfstate_bucket_name
    cluster:
      name: aqp-min
      ingress_class: alb
      ingress_host: hydrate://ssm/aqp/minimum/alb_dns_name
    endpoints:
      admin: hydrate://ssm/aqp/minimum/alb_dns_name
    images:
      registry: hydrate://ssm/aqp/minimum/ecr_registry
      app_version: replace-with-immutable-tag
      build_locally: false
      services:
        admin: aqp-admin
        admin_frontend: aqp-admin-frontend
        api: aqp-core
    auth:
      provider: aws_cognito
      required: true
      oidc_issuer: hydrate://ssm/aqp/minimum/cognito_user_pool_endpoint
      audience: ""
      scim_enabled: false
    services:
      - alb
      - ecs-fargate-cluster
      - cognito-user-pool
      - postgres
      - redis

  # ---------------------------------------------------------------------------
  # Phase G of the AWS hybrid rollout — AWS-native deployment target.
  # Composes the EKS Karpenter quant runtime (heritage AQP composition) with
  # the new ECS Fargate slice (admin BFF + AgentCore proxy) + the Bedrock
  # AgentCore + Knowledge Base + Cognito + CloudFront + EventBridge SFN
  # surfaces. The matching TerraformStackSpec lives at
  # ``aqp_platform/configs/terraform/aws.yaml`` and the rendered HCL bundle
  # at ``aqp_platform/terraform/environments/live/``.
  # ---------------------------------------------------------------------------
  aws:
    id: aws
    label: AWS hybrid (EKS Karpenter + ECS Fargate + Bedrock)
    kind: aws
    environment: live
    cloud_provider: aws
    namespace: aqp
    adapter_preference:
      - aws_eks      # primary — EKS Karpenter quant runtime
      - in_cluster   # fallback inside the EKS pod
    terraform:
      stack_slug: aqp-aws-live
      spec_path: aqp_platform/configs/terraform/aws.yaml
      environment_dir: aqp_platform/terraform/environments/live
      tfvars_path: aqp_platform/terraform/environments/live/terraform.tfvars
      backend_state_path: hydrate://ssm/aqp/${env}/tfstate_bucket_name
    cluster:
      name: hydrate://ssm/aqp/${env}/eks_cluster_name
      kubeconfig_path: ~/.kube/config
      kube_context: ""
      ingress_class: nginx
      ingress_host: aqp.fund
    endpoints:
      # Public marketing site + tenant API stay on the Cloudflare tunnel
      # (heritage edge) — admin + AgentCore land on CloudFront.
      frontend: https://aqp.fund
      api: https://api.aqp.fund
      manage: https://manage.aqp.fund
      admin: https://admin.aqp.fund
      agentcore: https://agentcore.aqp.fund
    images:
