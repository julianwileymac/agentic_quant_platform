version: 1

defaults:
  organization_slug: wiley-tech
  workspace_slug: main
  app_version: latest
  labels:
    app.kubernetes.io/managed-by: terraform
    app.kubernetes.io/part-of: aqp

tooling:
  terraform:
    binary_setting: AQP_TERRAFORM_BINARY
    min_version: "1.10"
    provider_mirror_path: data/terraform/plugin-cache
    plugin_cache_path: data/terraform/plugin-cache-runtime
    cli_config_file: data/terraform/terraform.tfrc
  local_shell:
    command: bash
    windows_path_prepend:
      - C:/Program Files/Git/bin

services:
  - id: aqp-core
    aliases: [aqp-api]
    label: AQP Core API
    role: api
    workload: deployment
    app_label: aqp-core
    container: api
    image_key: api
    port: 8000
    health_path: /readyz
    restartable: true
    logs_enabled: true
  - id: aqp-worker
    label: AQP Worker
    role: worker
    workload: deployment
    app_label: aqp-worker
    container: worker
    image_key: worker
    restartable: true
    logs_enabled: true
  - id: aqp-beat
    label: AQP Beat
    role: scheduler
    workload: deployment
    app_label: aqp-beat
    container: beat
    image_key: beat
    restartable: true
    logs_enabled: true
  - id: aqp-client
    aliases: [aqp-frontend]
    label: AQP Client
    role: frontend
    workload: deployment
    app_label: aqp-client
    container: client
    image_key: frontend
    port: 80
    health_path: /
    restartable: true
    logs_enabled: true
  - id: aqp-ui
    aliases: [aqp-frontend-cloud, aqp-paas]
    label: AQP UI (Cloud)
    role: frontend
    workload: deployment
    app_label: aqp-ui
    namespace: aqp-ui
    container: ui
    image_key: ui
    port: 80
    health_path: /api/healthz
    restartable: true
    logs_enabled: true
    endpoints:
      url: http://aqp-ui.aqp-ui.svc.cluster.local:80
      public_url: https://aqp.fund
  - id: aqp-cp
    label: AQP Control Plane
    role: control-plane
    workload: deployment
    app_label: aqp-cp
    container: control-plane
    image_key: cp
    port: 9000
    health_path: /manage/readyz
    restartable: true
    logs_enabled: true
  - id: aqp-ml-mcp
    label: AQP MLOps MCP Server
    # Dedicated MCP server publishing the ``data.ml.*`` slice of
    # the DataMCP catalog under its own audience claim. Initial
    # deployment piggybacks on the API pod (the FastAPI router at
    # ``/mcp/ml``); production rollouts can split it into its own
    # sidecar / pod when GPU isolation matters. See AGENTS rule 49.
    role: mcp
    workload: deployment
    app_label: aqp-core
    container: api
    image_key: api
    port: 8000
    health_path: /mcp/ml/tools
    restartable: true
    logs_enabled: true
    endpoints:
      http: http://aqp-core.aqp.svc.cluster.local:8000/mcp/ml
  - id: aqp-docs
    aliases: [aqp-docs-edge, docs-aqp-fund]
    label: AQP Docs (Edge Property)
    role: docs
    # Edge property — NOT a cluster workload. Hosted on Cloudflare
    # Pages at https://docs.aqp.fund. See AGENTS rule 47 +
    # aqp_platform/terraform/modules/cloudflare_pages_docs/.
    workload: external
    restartable: false
    logs_enabled: false
    endpoints:
      url: https://docs.aqp.fund
      public_url: https://docs.aqp.fund
      mcp_url: https://docs.aqp.fund/mcp
      llms_txt: https://docs.aqp.fund/llms.txt
      llms_full_txt: https://docs.aqp.fund/llms-full.txt
  - id: aqp-docs-status
    aliases: [status-aqp-fund]
    label: AQP Status (Instatus)
    role: status-page
    # Separate Cloudflare zone; lives at https://status.aqp.fund.
    # Standalone for incident-time resilience — must stay up when
    # the rest of the stack is degraded.
    workload: external
    restartable: false
    logs_enabled: false
    endpoints:
      url: https://status.aqp.fund
      public_url: https://status.aqp.fund
  - id: aqp-docs-archive
    aliases: [archive-aqp-fund]
    label: AQP Docs (Sunset Archive)
    role: docs-archive
    # Sunset Stripe-style API epochs freeze on archive.aqp.fund.
    workload: external
    restartable: false
    logs_enabled: false
    endpoints:
      url: https://archive.aqp.fund
      public_url: https://archive.aqp.fund
  - id: postgres
    label: PostgreSQL pgvector
    role: database
    workload: statefulset
    app_label: postgres
    container: postgres
    port: 5432
    storage: 5Gi
    restartable: false
    logs_enabled: true
  - id: redis
    label: Redis
    role: cache
    workload: statefulset
    app_label: redis
    container: redis
    port: 6379
    storage: 2Gi
    restartable: false
    logs_enabled: true
  - id: neo4j
    label: Neo4j
    role: graph
    workload: statefulset
    app_label: neo4j
    container: neo4j
    port: 7474
    storage: 5Gi
    restartable: false
    logs_enabled: true
  - id: chromadb
    label: ChromaDB
    role: vector-store
    workload: deployment
    app_label: chromadb
    container: chromadb
    port: 8000
    restartable: false
    logs_enabled: true
  - id: mlflow
    label: MLflow
    role: mlops
    workload: deployment
    app_label: mlflow
    container: mlflow
    port: 5000
    restartable: false
    logs_enabled: true
  - id: otel-collector
    label: OpenTelemetry Collector
    role: observability
    workload: deployment
    app_label: otel-collector
    container: otel-collector
    port: 4317
    restartable: false
    logs_enabled: true
  - id: jaeger
    label: Jaeger
    role: tracing
    workload: deployment
    app_label: jaeger
    container: jaeger
    port: 16686
    restartable: false
    logs_enabled: true

  # =========================================================================
  # Phase 1 of the AQP infra-expansion plan: lift-and-shift declaration of
  # AQP-owned shared cluster services. Workload manifests fill in during
  # Phase 2 (additive: redpanda, questdb, phoenix, hudi, kube-prom-stack,
  # opentelemetry-operator) and Phase 5 (legacy lift-and-shift from
  # rpi_kubernetes/kubernetes/{base-services,observability,mlops}/).
  # The namespace + endpoints fields make these the canonical addresses
  # that aqp.config.topology_fallback resolves to when AQP_* env vars are
  # unset on URL-typed Settings fields.
  # =========================================================================

  # --- Streaming (Strimzi + Redpanda side-by-side per plan question 2) ----
  - id: kafka
    aliases: [kafka-strimzi, strimzi]
    label: Strimzi Kafka
    role: streaming
    workload: statefulset
    app_label: trading-kafka
    cluster: streaming.strimzi
    namespace: aqp-streaming
    port: 9092
    storage: 50Gi
    restartable: false
    logs_enabled: true
    protocols:
      kafka: 9092
      kafka_tls: 9093
      kafka_external: 9094
    endpoints:
      bootstrap: trading-kafka-kafka-bootstrap.aqp-streaming.svc.cluster.local:9092
      admin_bootstrap: trading-kafka-kafka-bootstrap.aqp-streaming.svc.cluster.local:9092
  - id: schema-registry
    label: Apicurio Schema Registry
    role: streaming
    workload: deployment
    app_label: apicurio-registry
    cluster: streaming.strimzi
    namespace: aqp-streaming
    port: 8080
    restartable: false
    logs_enabled: true
    endpoints:
      ccompat: http://apicurio-registry.aqp-streaming.svc.cluster.local:8080/apis/ccompat/v7
  - id: redpanda
    label: Redpanda
    role: streaming
    workload: statefulset
    app_label: redpanda
    cluster: streaming.redpanda
    namespace: aqp-streaming
    port: 9092
    storage: 100Gi
    restartable: false
    logs_enabled: true
    protocols:
      kafka: 9092
      admin: 9644
      schema_registry: 8081
      pandaproxy: 8082
    endpoints:
      bootstrap: redpanda.aqp-streaming.svc.cluster.local:9092
      admin: http://redpanda.aqp-streaming.svc.cluster.local:9644
      schema_registry: http://redpanda.aqp-streaming.svc.cluster.local:8081
  - id: redpanda-connect
    label: Redpanda Connect
    role: streaming
    workload: deployment
    app_label: redpanda-connect
    cluster: streaming.redpanda
    namespace: aqp-streaming
    port: 4195
    restartable: true
    logs_enabled: true
    endpoints:
      ui: http://redpanda-connect.aqp-streaming.svc.cluster.local:4195
  - id: flink
    label: Apache Flink Session Cluster
    role: streaming
    workload: deployment
    app_label: flink-trading
    cluster: streaming.flink
    namespace: aqp-streaming
    port: 8081
    restartable: false
    logs_enabled: true
    endpoints:
      rest: http://flink-trading-rest.aqp-streaming.svc.cluster.local:8081

  # --- Time-series database (Phase 2 - new) -------------------------------
  - id: questdb
    label: QuestDB
    role: timeseries
    workload: statefulset
    app_label: questdb
    cluster: timeseries.questdb
    namespace: aqp-timeseries
    port: 9000
    storage: 200Gi
    restartable: false
    logs_enabled: true
    protocols:
      http: 9000
      ilp_tcp: 9009
      pgwire: 8812
    endpoints:
      http: http://questdb.aqp-timeseries.svc.cluster.local:9000
      ilp_tcp: questdb.aqp-timeseries.svc.cluster.local:9009
      pgwire: postgresql://aqp:aqp@questdb.aqp-timeseries.svc.cluster.local:8812/qdb

  # --- Lakehouse (Iceberg canonical + Hudi additive per plan section D) ---
  - id: polaris
    label: Polaris Iceberg Catalog
    role: lakehouse
    workload: deployment
    app_label: polaris
    cluster: lakehouse.iceberg
    namespace: aqp-lakehouse
    port: 8181
    restartable: false
    logs_enabled: true
    endpoints:
      rest: http://polaris.aqp-lakehouse.svc.cluster.local:8181
      iceberg_rest: http://polaris.aqp-lakehouse.svc.cluster.local:8181/api/catalog/v1
  - id: hudi
    label: Apache Hudi (additive)
    role: lakehouse
    workload: external
    app_label: hudi
    cluster: lakehouse.hudi
    namespace: aqp-lakehouse
    restartable: false
    logs_enabled: false
    endpoints:
      warehouse: s3://aqp-lakehouse/hudi/
      metastore: thrift://polaris.aqp-lakehouse.svc.cluster.local:9083
  - id: spark-operator
    label: Spark Operator (Hudi writer host)
    role: lakehouse
    workload: deployment
    app_label: spark-operator
    cluster: lakehouse.hudi
    namespace: aqp-mlops
    port: 8443
    restartable: true
    logs_enabled: true

  # --- Observability (kube-prometheus-stack + OTel + Phoenix - Phase 2) ---
  - id: prometheus
    label: Prometheus (kube-prometheus-stack)
    role: observability
    workload: statefulset
    app_label: prometheus
    cluster: observability.metrics
    namespace: aqp-observability
    port: 9090
    storage: 100Gi
    restartable: false
    logs_enabled: true
    endpoints:
      query: http://prometheus-operated.aqp-observability.svc.cluster.local:9090
      remote_write: http://prometheus-operated.aqp-observability.svc.cluster.local:9090/api/v1/write
  - id: grafana
    label: Grafana
    role: observability
    workload: deployment
    app_label: grafana
    cluster: observability.metrics
    namespace: aqp-observability
    port: 3000
    restartable: true
    logs_enabled: true
    endpoints:
      ui: http://grafana.aqp-observability.svc.cluster.local:3000
  - id: tempo
    label: Grafana Tempo
    role: tracing
    workload: statefulset
    app_label: tempo
    cluster: observability.tracing
    namespace: aqp-observability
    port: 3200
    storage: 100Gi
    restartable: false
    logs_enabled: true
    protocols:
      http: 3200
      otlp_grpc: 4317
      otlp_http: 4318
    endpoints:
      query: http://tempo.aqp-observability.svc.cluster.local:3200
      otlp_grpc: tempo.aqp-observability.svc.cluster.local:4317
      otlp_http: http://tempo.aqp-observability.svc.cluster.local:4318
  - id: loki
    label: Grafana Loki
    role: logging
    workload: statefulset
    app_label: loki
    cluster: observability.logging
    namespace: aqp-observability
    port: 3100
    storage: 200Gi
    restartable: false
    logs_enabled: true
    endpoints:
      push: http://loki.aqp-observability.svc.cluster.local:3100/loki/api/v1/push
      query: http://loki.aqp-observability.svc.cluster.local:3100
  - id: phoenix
    label: Arize Phoenix (LLM/agent/RAG observability)
    role: observability
    workload: deployment
    app_label: phoenix
    cluster: observability.ai
    namespace: aqp-observability
    port: 6006
    storage: 16Gi
    restartable: true
    logs_enabled: true
    protocols:
      ui_http: 6006
      otlp_grpc: 4317
    endpoints:
      ui: http://phoenix.aqp-observability.svc.cluster.local:6006
      otlp_http: http://phoenix.aqp-observability.svc.cluster.local:6006
      otlp_grpc: phoenix.aqp-observability.svc.cluster.local:4317
  - id: marquez
    label: Marquez (OpenLineage)
    role: observability
    workload: deployment
    app_label: marquez
    cluster: observability.lineage
    namespace: aqp-observability
    port: 5000
    storage: 4Gi
    restartable: true
    logs_enabled: true
    protocols:
      http: 5000
    endpoints:
      http: http://marquez.aqp-observability.svc.cluster.local:5000
      lineage: http://marquez.aqp-observability.svc.cluster.local:5000/api/v1/lineage
  - id: phoenix-postgres
    label: Phoenix Postgres backend
    role: database
    workload: statefulset
    app_label: phoenix-postgresql
    cluster: observability.ai
    namespace: aqp-observability
    port: 5432
    storage: 16Gi
    restartable: false
    logs_enabled: true

  # --- Data services (lift-and-shift; canonical owner now AQP) ------------
  - id: postgres-shared
    label: Shared PostgreSQL
    role: database
    workload: statefulset
    app_label: postgresql
    cluster: data-services
    namespace: aqp-data-services
    port: 5432
    storage: 50Gi
    restartable: false
    logs_enabled: true
    endpoints:
      dsn: postgresql+psycopg2://aqp:aqp@postgresql.aqp-data-services.svc.cluster.local:5432/aqp
      async_dsn: postgresql+asyncpg://aqp:aqp@postgresql.aqp-data-services.svc.cluster.local:5432/aqp
  - id: redis-shared
    label: Shared Redis (cache + RAG)
    role: cache
    workload: statefulset
    app_label: redis
    cluster: data-services
    namespace: aqp-data-services
    port: 6379
    storage: 8Gi
    restartable: false
    logs_enabled: true
    endpoints:
      url: redis://redis.aqp-data-services.svc.cluster.local:6379/0
      pubsub_url: redis://redis.aqp-data-services.svc.cluster.local:6379/1
      cache_url: redis://redis.aqp-data-services.svc.cluster.local:6379/2
  - id: minio
    label: MinIO (S3-compatible object storage)
    role: storage
    workload: statefulset
    app_label: minio
    cluster: data-services
    namespace: aqp-data-services
    port: 9000
    storage: 500Gi
    restartable: false
    logs_enabled: true
    protocols:
      s3: 9000
      console: 9001
    endpoints:
      endpoint: http://minio.aqp-data-services.svc.cluster.local:9000
      console: http://minio.aqp-data-services.svc.cluster.local:9001

  # --- MLOps (lift-and-shift Phase 5) -------------------------------------
  - id: mlflow
    label: MLflow Tracking Server
    role: mlops
    workload: deployment
    app_label: mlflow
    cluster: mlops.tracking
    namespace: aqp-mlops
    port: 5000
    restartable: true
    logs_enabled: true
    endpoints:
      tracking: http://mlflow.aqp-mlops.svc.cluster.local:5000
  - id: dagster
    label: Dagster Webserver
    role: orchestration
    workload: deployment
    app_label: dagster-webserver
    cluster: mlops.orchestration
    namespace: aqp-mlops
    port: 80
    restartable: true
    logs_enabled: true
    endpoints:
      webserver: http://dagster-dagster-webserver.aqp-mlops.svc.cluster.local
      graphql: http://dagster-dagster-webserver.aqp-mlops.svc.cluster.local/graphql

  # --- ELT (lift-and-shift Phase 5) ---------------------------------------
  - id: airbyte
    label: Airbyte (visual builder + workspace)
    role: elt
    workload: deployment
    app_label: airbyte-server
    cluster: elt.airbyte
    namespace: aqp-elt
    port: 8001
    restartable: true
    logs_enabled: true
    endpoints:
      ui: http://airbyte-server-svc.aqp-elt.svc.cluster.local:8001
      api: http://airbyte-server-svc.aqp-elt.svc.cluster.local:8001/api/v1

  # --- Vector + metadata stores (lift-and-shift Phase 5) ------------------
  - id: chromadb
    label: ChromaDB (lightweight vector store)
    role: vector-store
    workload: deployment
    app_label: chromadb
    cluster: data-services
    namespace: aqp-data-services
    port: 8000
    restartable: false
    logs_enabled: true
    endpoints:
      host: http://chromadb.aqp-data-services.svc.cluster.local:8000
  - id: datahub
    label: DataHub GMS
    role: metadata
    workload: deployment
    app_label: datahub-datahub-gms
    cluster: data-services
    namespace: aqp-data-services
    port: 8080
    restartable: true
    logs_enabled: true
    endpoints:
      gms: http://datahub-datahub-gms.aqp-data-services.svc.cluster.local:8080

  # ---------------------------------------------------------------------------
  # Phase G of the AWS hybrid rollout — AWS-native managed services that
  # are NOT cluster-resident. The seven entries below are referenced from
  # the ``aws`` target below and the ``cell-shared-std-us-east-1a`` cell.
  # ---------------------------------------------------------------------------
  - id: bedrock-agentcore-runtime
    label: Bedrock AgentCore Runtime
    component: agentic
    cluster: aws
    namespace: aws-managed
    protocols: [https]
    restartable: false
    logs_enabled: true
    endpoints:
      runtime_arn: hydrate://ssm/aqp/${env}/agentcore_runtime_arn
    annotations:
      aqp.io/managed-by: aws-bedrock
      aqp.io/cpu-architecture: arm64
      aqp.io/session_max_seconds: "28800"

  - id: bedrock-agentcore-gateway
    label: Bedrock AgentCore Gateway
    component: agentic
    cluster: aws
    namespace: aws-managed
    protocols: [https]
    restartable: false
    logs_enabled: true
    endpoints:
      gateway_arn: hydrate://ssm/aqp/${env}/agentcore_gateway_arn
      tool_config_uri: hydrate://ssm/aqp/${env}/agentcore_gateway_tool_config_uri

  - id: bedrock-agentcore-memory
    label: Bedrock AgentCore Memory
    component: agentic
    cluster: aws
    namespace: aws-managed
    protocols: [https]
    endpoints:
      memory_id: hydrate://ssm/aqp/${env}/agentcore_memory_id

  - id: bedrock-kb-collection
    label: Bedrock Knowledge Base (OpenSearch Serverless)
    component: rag
    cluster: aws
    namespace: aws-managed
    protocols: [https]
    endpoints:
      collection_arn: hydrate://ssm/aqp/${env}/kb_collection_arn
      kb_id: hydrate://ssm/aqp/${env}/kb_knowledge_base_id
      source_bucket: hydrate://ssm/aqp/${env}/kb_source_bucket

  - id: cognito-user-pool
    label: Cognito User Pool
    component: identity
    cluster: aws
    namespace: aws-managed
    protocols: [https]
    endpoints:
      user_pool_id: hydrate://ssm/aqp/${env}/cognito_user_pool_id
      user_pool_endpoint: hydrate://ssm/aqp/${env}/cognito_user_pool_endpoint
      user_pool_domain: hydrate://ssm/aqp/${env}/cognito_user_pool_domain

  - id: cloudfront-distribution
    label: CloudFront (admin + AgentCore edge)
    component: edge
    cluster: aws
    namespace: aws-managed
    protocols: [https]
    endpoints:
      domain: hydrate://ssm/aqp/${env}/cloudfront_domain
      distribution_id: hydrate://ssm/aqp/${env}/cloudfront_distribution_id
    annotations:
      aqp.io/aliases: admin.aqp.fund,agentcore.aqp.fund
      aqp.io/cloudflare-edge: aqp.fund,api.aqp.fund,manage.aqp.fund

  - id: ecs-fargate-cluster
    label: ECS Fargate (admin BFF + AgentCore proxy)
    component: compute
    cluster: aws
    namespace: aws-managed
    protocols: [https]
    restartable: true
    logs_enabled: true
    endpoints:
      cluster_name: hydrate://ssm/aqp/${env}/ecs_cluster_name
      cluster_arn: hydrate://ssm/aqp/${env}/ecs_cluster_arn
      service_names: hydrate://ssm/aqp/${env}/ecs_service_names

  - id: alb
    label: Application Load Balancer
    component: edge
    cluster: aws
    namespace: aws-managed
    protocols: [https]
    endpoints:
      default: hydrate://ssm/aqp/${env}/alb_dns_name
      zone_id: hydrate://ssm/aqp/${env}/alb_zone_id

  - id: eventbridge-stepfunctions
    label: EventBridge + Step Functions
    component: orchestration
    cluster: aws
    namespace: aws-managed
    protocols: [https]
    endpoints:
      state_machine_arn: hydrate://ssm/aqp/${env}/nightly_sfn_arn
      nightly_rule_arn: hydrate://ssm/aqp/${env}/nightly_rule_arn

targets:
  local:
    id: local
    label: Local k3d
    kind: local
    environment: local
    cloud_provider: local
    namespace: aqp-local
    adapter_preference:
      - in_cluster
      - local_compose
    terraform:
      stack_slug: aqp-local
      spec_path: aqp_platform/configs/terraform/local.yaml
      environment_dir: aqp_platform/terraform/environments/local
      tfvars_path: aqp_platform/terraform/environments/local/terraform.tfvars
      backend_state_path: data/terraform/state/local.tfstate
    cluster:
      name: aqp-local
      kubeconfig_path: ~/.kube/aqp-local.config
      k3d_image: rancher/k3s:v1.30.4-k3s1
      registry_name: aqp-registry
      registry_port: 5001
      registry_host: aqp-registry:5001
      registry_localhost: localhost:5001
      lb_http_port: 8000
      lb_https_port: 3001
      ingress_class: traefik
    endpoints:
      frontend: http://localhost:8000/
      api: http://localhost:8000/api
      registry: localhost:5001
    images:
      registry: aqp-registry:5001
      app_version: latest
      build_locally: true
      services:
        api: aqp-core
        worker: aqp-worker
        beat: aqp-beat
        paper: aqp-paper
        serving: aqp-serving
        ingester: aqp-ingester
        frontend: aqp-client
    auth:
      provider: local
      required: false
      scim_enabled: false
    services:
      - aqp-core
      - aqp-worker
      - aqp-beat
      - aqp-client
      - postgres
      - redis
      - neo4j
      - chromadb
      - mlflow
      - otel-collector
      - jaeger
      # Phase 1 of the infra-expansion plan: AQP-owned shared infra services
      # (declarations only - workload manifests fill in Phase 2 + Phase 5).
      - kafka
      - schema-registry
      - redpanda
      - redpanda-connect
      - flink
      - questdb
      - polaris
      - hudi
      - spark-operator
      - prometheus
      - grafana
      - tempo
      - loki
      - phoenix
      - phoenix-postgres
