[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-python-producer-template"
version = "0.1.0"
description = "Template Kafka Avro producer for the rpi_kubernetes trading-kafka cluster."
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.4",
    "fastavro>=1.9",
    "httpx>=0.27",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "opentelemetry-instrumentation-confluent-kafka>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
kafka-producer-template = "producer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["producer*"]
