apiVersion: v1
kind: ConfigMap
metadata:
  name: alphavantage-producer-config
  namespace: data-services
  labels:
    app.kubernetes.io/name: alphavantage-producer
data:
  # Environment fed via envFrom.
  AV_PRODUCER_BOOTSTRAP_SERVERS: "trading-kafka-kafka-bootstrap.data-services.svc.cluster.local:9094"
  AV_PRODUCER_SECURITY_PROTOCOL: "SASL_SSL"
  AV_PRODUCER_SASL_MECHANISM: "SCRAM-SHA-512"
  AV_PRODUCER_SASL_USERNAME: "producer-market"
  AV_PRODUCER_SSL_CA_LOCATION: "/etc/kafka/ca/ca.crt"
  AV_PRODUCER_SCHEMA_REGISTRY_URL: "http://apicurio-registry.data-services.svc.cluster.local:8080/apis/registry/v2"
  AV_PRODUCER_SCHEMA_GROUP: "default"
  AV_PRODUCER_AV_BASE_URL: "https://www.alphavantage.co/query"
  AV_PRODUCER_AV_API_KEY_FILE: "/var/run/secrets/alphavantage/api-key"
  AV_PRODUCER_AV_RPM_LIMIT: "75"
  AV_PRODUCER_AV_DAILY_LIMIT: "0"
  AV_PRODUCER_METRICS_PORT: "9312"
  AV_PRODUCER_CONFIG_FILE: "/etc/alphavantage-producer/config.yaml"
  AV_PRODUCER_OTEL_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
  AV_PRODUCER_SERVICE_NAME: "alphavantage-producer"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alphavantage-producer-universe
  namespace: data-services
  labels:
    app.kubernetes.io/name: alphavantage-producer
data:
  # Default symbol universe & per-stream cadence. Edit and `kubectl rollout
  # restart deployment/alphavantage-producer` to apply.
  config.yaml: |
    streams:
      quote:
        enabled: true
        interval_seconds: 60
      bar:
        enabled: true
        interval_seconds: 300
        interval: "5min"
        outputsize: "compact"
      fx:
        enabled: true
        interval_seconds: 60
      crypto:
        enabled: true
        interval_seconds: 120
        interval: "5min"
      news:
        enabled: true
        interval_seconds: 300
      gainers:
        enabled: true
        interval_seconds: 300
      indicator:
        enabled: true
        interval_seconds: 600
    universe:
      equities:
        - IBM
        - AAPL
        - MSFT
        - GOOGL
        - NVDA
        - SPY
        - QQQ
      fx_pairs:
        - {from: EUR, to: USD}
        - {from: USD, to: JPY}
        - {from: GBP, to: USD}
      crypto_pairs:
        - {symbol: BTC, market: USD}
        - {symbol: ETH, market: USD}
      options:
        - SPY
    indicators:
      - {name: SMA, symbol: IBM, interval: daily, time_period: 20, series_type: close}
      - {name: EMA, symbol: IBM, interval: daily, time_period: 20, series_type: close}
      - {name: RSI, symbol: IBM, interval: daily, time_period: 14, series_type: close}
      - {name: MACD, symbol: IBM, interval: daily, series_type: close}
      - {name: BBANDS, symbol: IBM, interval: daily, time_period: 20, series_type: close}
      - {name: VWAP, symbol: IBM, interval: 15min}
