plugins {
    id 'application'
    id 'com.gradleup.shadow' version '8.3.0'
    id 'java'
}

group = 'io.rpi.flink.sample'
version = '0.1.0'

sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

repositories {
    mavenCentral()
}

configurations {
    flinkShadowJar
    implementation.extendsFrom flinkShadowJar
}

dependencies {
    // Flink core APIs - PROVIDED by the cluster, so never bundle
    compileOnly "org.apache.flink:flink-streaming-java:${flinkVersion}"
    compileOnly "org.apache.flink:flink-clients:${flinkVersion}"
    compileOnly "org.apache.flink:flink-runtime-web:${flinkVersion}"

    // Shadowed: Kafka connector, Avro, Apicurio (these we bundle)
    flinkShadowJar "org.apache.flink:flink-connector-kafka:3.2.0-1.20"
    flinkShadowJar "org.apache.kafka:kafka-clients:${kafkaVersion}"
    flinkShadowJar "org.apache.avro:avro:${avroVersion}"
    flinkShadowJar "io.apicurio:apicurio-registry-serdes-avro-serde:${apicurioVersion}"

    // Logging (provided by Flink)
    compileOnly "org.slf4j:slf4j-api:${slf4jVersion}"
    compileOnly "org.apache.logging.log4j:log4j-api:${log4jVersion}"
    compileOnly "org.apache.logging.log4j:log4j-core:${log4jVersion}"

    // Test
    testImplementation "org.apache.flink:flink-streaming-java:${flinkVersion}:tests"
    testImplementation "org.apache.flink:flink-runtime:${flinkVersion}:tests"
    testImplementation "org.apache.flink:flink-test-utils-junit:${flinkVersion}"
    testImplementation "org.apache.flink:flink-test-utils:${flinkVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'io.rpi.flink.sample.SampleJob'
}

shadowJar {
    archiveClassifier.set('')
    configurations = [project.configurations.flinkShadowJar]
    mergeServiceFiles()
    zip64 true
    manifest {
        attributes 'Main-Class': 'io.rpi.flink.sample.SampleJob'
    }
}
