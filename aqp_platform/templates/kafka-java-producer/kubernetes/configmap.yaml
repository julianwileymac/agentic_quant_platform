apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-java-producer-template
data:
  KAFKA_BOOTSTRAP_SERVERS: "trading-kafka-kafka-bootstrap.data-services.svc.cluster.local:9094"
  KAFKA_SECURITY_PROTOCOL: "SASL_SSL"
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-512"
  KAFKA_SASL_USERNAME: "producer-market"
  KAFKA_SSL_TRUSTSTORE_LOCATION: "/etc/kafka/ca/truststore.jks"
  KAFKA_TOPIC: "market.trade.v1"
  KAFKA_SCHEMA_NAME: "market_trade_v1"
  SCHEMA_REGISTRY_URL: "http://apicurio-registry.data-services.svc.cluster.local:8080/apis/registry/v2"
  SCHEMA_GROUP: "default"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
  OTEL_SERVICE_NAME: "kafka-java-producer"
  OTEL_METRICS_EXPORTER: "none"
