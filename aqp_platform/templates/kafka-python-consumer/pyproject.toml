[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-python-consumer-template"
version = "0.1.0"
description = "Template async Kafka Avro consumer for the rpi_kubernetes trading-kafka cluster."
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.11",
    "fastavro>=1.9",
    "httpx>=0.27",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "opentelemetry-instrumentation-aiokafka>=0.45b0",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
kafka-consumer-template = "consumer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["consumer*"]
