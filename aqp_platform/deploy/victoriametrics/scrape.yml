# VictoriaMetrics scrape config for the local platform overlay.
#
# Scrapes:
# - the OTel collector's Prometheus exporter (already exposed on
#   :8889 in aqp_platform/compose/docker-compose.yml)
# - VictoriaMetrics's own /metrics
# - any compose service that opts in via the
#   `prometheus.io/scrape: "true"` label (mirrors the kube
#   ServiceMonitor pattern from rpi_kubernetes/kubernetes/observability/prometheus/).

global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: "victoriametrics"
    static_configs:
      - targets:
          - "victoriametrics:8428"

  - job_name: "otel-collector"
    static_configs:
      - targets:
          - "otel-collector:8889"

  - job_name: "aqp-api"
    static_configs:
      - targets:
          - "api:8000"
    metrics_path: "/metrics"
