[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi_k8s_sdk"
version = "0.2.0"
description = "Python SDK for the rpi_kubernetes streaming + Flink control plane."
requires-python = ">=3.11"
authors = [{ name = "Julian Wiley" }]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
storage = [
    "boto3>=1.35",
]
mlflow = [
    "mlflow>=2.10",
]
datahub = [
    "acryl-datahub>=0.13",
    "PyYAML>=6.0",
]
iceberg = [
    "pyiceberg[s3fs]>=0.7",
]
kubernetes = [
    "kubernetes>=30.1",
]
serving = [
    "huggingface-hub>=0.24",
]
otel = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "opentelemetry-instrumentation-redis>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-instrumentation-celery>=0.45b0",
]
aqp = [
    "duckdb>=1.0",
    "pyiceberg[s3fs]>=0.7",
    "boto3>=1.35",
    "mlflow>=2.10",
    "kubernetes>=30.1",
]
streaming = [
    "confluent-kafka>=2.4",
    "aiokafka>=0.11",
    "fastavro>=1.9",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "opentelemetry-instrumentation-confluent-kafka>=0.45b0",
    "opentelemetry-instrumentation-aiokafka>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
]
local = [
    "boto3>=1.35",
    "mlflow>=2.10",
    "acryl-datahub>=0.13",
    "PyYAML>=6.0",
    "pyiceberg[s3fs]>=0.7",
    "kubernetes>=30.1",
    "huggingface-hub>=0.24",
    "confluent-kafka>=2.4",
    "aiokafka>=0.11",
    "fastavro>=1.9",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-confluent-kafka>=0.45b0",
    "opentelemetry-instrumentation-aiokafka>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "opentelemetry-instrumentation-redis>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-instrumentation-celery>=0.45b0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rpi_k8s_sdk*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
