[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aqp-kernels"
version = "0.1.0"
description = "Hybrid local-to-cloud developer experience for the Agentic Quant Platform — Jupyter Enterprise Gateway integration, per-user kernel pods, secret broker sidecar, Dagster Pipes wrappers, SDK auto-injection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AQP Platform Team" }]
keywords = ["aqp", "jupyter", "kernels", "dagster-pipes", "kubernetes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "aqp-ratelimit>=0.1.0",
]

[project.optional-dependencies]
gateway = [
    "jupyter-server>=2.10",
    "jupyter-enterprise-gateway>=3.2",
    "kubernetes>=29.0",
]
pipes = [
    "dagster-pipes>=1.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/julianwiley/agentic_quant_platform"
Issues = "https://github.com/julianwiley/agentic_quant_platform/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aqp_kernels"]

[tool.hatch.build.targets.sdist]
include = [
    "src/aqp_kernels",
    "gateway",
    "pods",
    "secret_broker",
    "pipes",
    "tasks",
    "api",
    "configs",
    "tests",
    "README.md",
    "AGENTS.md",
    "INDEX.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
