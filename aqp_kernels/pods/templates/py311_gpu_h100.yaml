apiVersion: v1
kind: Pod
metadata:
  generateName: aqp-kernel-py311-h100-
  labels:
    app.kubernetes.io/name: aqp-kernel
    app.kubernetes.io/component: kernel
    app.kubernetes.io/part-of: aqp-kernels
    aqp.io/stack: py311-gpu-h100
spec:
  restartPolicy: Never
  serviceAccountName: aqp-kernel
  nodeSelector:
    nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: kernel
      image: ghcr.io/aqp/quant-research:py311-cuda
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: '8'
          memory: 64Gi
          nvidia.com/gpu: '1'
        limits:
          cpu: '16'
          memory: 128Gi
          nvidia.com/gpu: '1'
      env:
        - name: HTTPS_PROXY
          value: http://rl-proxy.aqp-system.svc.cluster.local:8080
        - name: HTTP_PROXY
          value: http://rl-proxy.aqp-system.svc.cluster.local:8080
        - name: AQP_KERNEL_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
      volumeMounts:
        - name: secret-broker
          mountPath: /var/run
    - name: secret-broker
      image: ghcr.io/aqp/secret-broker:0.1.0
      volumeMounts:
        - name: secret-broker
          mountPath: /var/run
  volumes:
    - name: secret-broker
      emptyDir: {}
