# .vale.ini — prose linter configuration for the AQP docs site.
#
# Inherits the Microsoft Writing Style Guide (per the patterns at
# Datadog, GitLab, Buildkite, Elastic, Stoplight) and layers AQP
# vocabulary + custom rules on top.
#
# Run locally:    pnpm --filter aqp_docs vale
# Run in CI:      .github/workflows/docs-ci.yml (vale job)

StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = AQP
Packages = Microsoft

[*.{md,mdx}]
BasedOnStyles = Vale, Microsoft, AQP
TokenIgnores = (\$[^\n$]+\$), (`[^`\n]+`), \[\d+:\d+:[^\]]+\]
BlockIgnores = (?s)```[^\n]*\n.+?```, (?s)<details>.+?</details>, (?s)<!--.+?-->

# Microsoft sets ".Avoid" rules to suggestion level. We bump the
# words we particularly want gone to "error" so they block CI.
Microsoft.Avoid = error
Microsoft.We = warning
Microsoft.Wordiness = warning

# Don't enforce title-case on docs that are intentionally lowercase
# (mostly the auto-generated reference pages).
Microsoft.Headings = NO

[docs/reference/python/**/*.{md,mdx}]
# Auto-generated. Style enforcement is wasted effort and the noise
# in CI is high.
BasedOnStyles =
