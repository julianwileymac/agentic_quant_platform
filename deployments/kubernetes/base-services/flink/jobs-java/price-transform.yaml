apiVersion: flink.apache.org/v1beta1
kind: FlinkSessionJob
metadata:
  name: indicators-price-transform
  namespace: aqp-streaming
  labels:
    app: flink-trading-session
    job: indicators-price-transform
    pipeline-stage: compute
    category: price-transform
spec:
  deploymentName: flink-trading-session
  job:
    jarURI: s3://flink-jobs/java/indicators-price-transform.jar
    entryClass: io.rpi.flink.indicators.pricetx.PriceTransformJob
    args:
      - "--kafka.bootstrap.servers"
      - "trading-kafka-kafka-bootstrap.aqp-streaming.svc.cluster.local:9092"
      - "--kafka.source.topic"
      - "market.bar.v1"
      - "--kafka.sink.topic"
      - "features.indicators.v1"
      - "--kafka.group.id"
      - "flink-java-pricetx"
      - "--schema.registry.url"
      - "http://apicurio-registry.aqp-streaming.svc.cluster.local:8080/apis/registry/v2"
      - "--category.label"
      - "price_transform"
    parallelism: 1
    upgradeMode: savepoint
    state: suspended
