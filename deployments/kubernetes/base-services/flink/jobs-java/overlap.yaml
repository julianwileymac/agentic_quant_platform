# =============================================================================
# FlinkSessionJob - Overlap Studies (SMA, EMA, WMA, BBANDS, SAR, ...)
# =============================================================================
# Source: flink-jobs-java/indicators-overlap/
# =============================================================================
apiVersion: flink.apache.org/v1beta1
kind: FlinkSessionJob
metadata:
  name: indicators-overlap
  namespace: aqp-streaming
  labels:
    app: flink-trading-session
    job: indicators-overlap
    pipeline-stage: compute
    category: overlap
spec:
  deploymentName: flink-trading-session
  job:
    jarURI: s3://flink-jobs/java/indicators-overlap.jar
    entryClass: io.rpi.flink.indicators.overlap.OverlapJob
    args:
      - "--kafka.bootstrap.servers"
      - "trading-kafka-kafka-bootstrap.aqp-streaming.svc.cluster.local:9092"
      - "--kafka.source.topic"
      - "market.bar.v1"
      - "--kafka.sink.topic"
      - "features.indicators.v1"
      - "--kafka.group.id"
      - "flink-java-overlap"
      - "--schema.registry.url"
      - "http://apicurio-registry.aqp-streaming.svc.cluster.local:8080/apis/registry/v2"
      - "--window.size.seconds"
      - "60"
      - "--buffer.size"
      - "300"
      - "--category.label"
      - "overlap"
    parallelism: 1
    upgradeMode: savepoint
    state: suspended
