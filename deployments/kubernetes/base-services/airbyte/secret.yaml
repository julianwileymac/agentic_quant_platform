apiVersion: v1
kind: Secret
metadata:
  name: airbyte-secrets
  namespace: elt
  labels:
    app.kubernetes.io/name: airbyte
    app.kubernetes.io/component: elt
type: Opaque
stringData:
  # Replace before enabling Airbyte externally.
  AIRBYTE_DATABASE_PASSWORD: "__SET_AIRBYTE_DB_PASSWORD__"
  AIRBYTE_AUTH_CLIENT_SECRET: "__SET_AIRBYTE_AUTH_CLIENT_SECRET__"
  AIRBYTE_MINIO_ACCESS_KEY: "svc-airbyte"
  AIRBYTE_MINIO_SECRET_KEY: "svc-airbyte-change-me"
