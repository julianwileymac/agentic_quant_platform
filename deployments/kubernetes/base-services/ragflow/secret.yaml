# =============================================================================
# RAGFlow Secrets
# =============================================================================
# Redis: RAGFlow now connects to the shared Redis 8 Stack deployment defined
# in base-services/redis/.  The `ragflow-redis.aqp-elt.svc.cluster.local`
# hostname is kept stable by an alias Service, and RAGFlow continues to use
# db=1 per local.service_conf.yaml.  The `redis-password` below MUST stay in
# sync with base-services/redis/secret.yaml (`redis-credentials.password`).
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: ragflow-secrets
  namespace: aqp-elt
  labels:
    app: ragflow
type: Opaque
stringData:
  # PostgreSQL
  pg-host: postgresql.aqp-elt.svc.cluster.local
  pg-port: "5432"
  pg-database: ragflow
  pg-user: ragflow
  pg-password: ragflow123

  # MinIO
  minio-host: minio.aqp-elt.svc.cluster.local
  minio-port: "9000"
  minio-user: minioadmin
  minio-password: minioadmin123

  # Redis (shared Redis 8 Stack; alias svc keeps hostname stable)
  # MUST match base-services/redis/secret.yaml -> redis-credentials.password
  redis-host: ragflow-redis.aqp-elt.svc.cluster.local
  redis-port: "6379"
  redis-password: ragflow123

  # Elasticsearch
  es-host: elasticsearch-master.aqp-elt.svc.cluster.local
  es-port: "9200"
  es-user: elastic
  es-password: ""

  # RAGFlow encryption key (used for token signing)
  secret-key: ragflow-rpi-k8s-secret-key-change-me
