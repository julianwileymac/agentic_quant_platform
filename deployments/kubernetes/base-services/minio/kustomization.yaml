apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aqp-data-services

resources:
  - secret.yaml
  - service-credentials.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - bootstrap-buckets-job.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: minio
      app.kubernetes.io/component: storage
      app.kubernetes.io/part-of: rpi-k8s-platform
