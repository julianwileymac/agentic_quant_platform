# Redpanda cluster (side-by-side with Strimzi Kafka per the AQP
# infra-expansion plan). The Redpanda Operator is installed via Helm
# in the bootstrap step (see scripts/cluster_install/install-redpanda.sh
# generated in Phase 5); this kustomization only declares the cluster CR
# and supporting resources.
#
# Topology contract:
#   topology.yaml > services > redpanda
#   bootstrap: redpanda.aqp-streaming.svc.cluster.local:9092
#   admin:     http://redpanda.aqp-streaming.svc.cluster.local:9644
#
# AQP-side routing: aqp.streaming.clusters.TOPIC_PREFIX_ROUTES sends
# market.l1.* / market.l2.* / execution.orders.* / agentic.state.*
# topics to this cluster; everything else stays on Strimzi.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aqp-streaming

commonLabels:
  app.kubernetes.io/part-of: aqp
  app.kubernetes.io/component: streaming
  app.kubernetes.io/managed-by: kustomize
  aqp.internal/cluster: streaming.redpanda

resources:
  - cluster.yaml
  - service.yaml
  - servicemonitor.yaml
  - poddisruptionbudget.yaml
