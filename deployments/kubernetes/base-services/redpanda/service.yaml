# Stable in-cluster Service alias matching the topology.yaml endpoints
# entry. The Redpanda Operator creates its own headless Service for
# Raft + per-broker addressing; this Service is the single canonical
# bootstrap address that aqp.streaming.clusters.StreamingCluster
# resolves to (redpanda.aqp-streaming.svc.cluster.local).
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: aqp-streaming
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/component: streaming
    app.kubernetes.io/part-of: aqp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/instance: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
      protocol: TCP
    - name: admin
      port: 9644
      targetPort: 9644
      protocol: TCP
    - name: schema-registry
      port: 8081
      targetPort: 8081
      protocol: TCP
    - name: pandaproxy
      port: 8082
      targetPort: 8082
      protocol: TCP
