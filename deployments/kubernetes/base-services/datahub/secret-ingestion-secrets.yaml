apiVersion: v1
kind: Secret
metadata:
  name: datahub-ingestion-secrets
  namespace: aqp-data-services
  labels:
    app.kubernetes.io/name: datahub
    app.kubernetes.io/component: metadata-ingestion
type: Opaque
stringData:
  # Set a valid DataHub personal access token before enabling CronJobs.
  DATAHUB_TOKEN: "__SET_DATAHUB_TOKEN__"

  # Dedicated ingestion credentials (separate from platform runtime secrets).
  INGEST_POSTGRES_USERNAME: "datahub"
  INGEST_POSTGRES_PASSWORD: "__SET_POSTGRES_PASSWORD__"
  INGEST_MINIO_ACCESS_KEY: "svc-datahub"
  INGEST_MINIO_SECRET_KEY: "svc-datahub-change-me"
  INGEST_ICEBERG_REST_CREDENTIAL: "root:s3cr3t"

  # Optional source-specific credentials. Leave placeholders empty/unset in
  # the cluster secret until the source requires authentication.
  INGEST_GRAFANA_SERVICE_ACCOUNT_TOKEN: "__SET_GRAFANA_SERVICE_ACCOUNT_TOKEN__"
  INGEST_AIRBYTE_TOKEN: "__SET_AIRBYTE_TOKEN__"
