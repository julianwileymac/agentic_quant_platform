---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: admin-sdk
  namespace: aqp-streaming
  labels:
    strimzi.io/cluster: trading-kafka
    role: admin
    scope: sdk
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: ""
          patternType: literal
        operations: [All]
        host: "*"
      - resource:
          type: group
          name: ""
          patternType: literal
        operations: [All]
        host: "*"
      - resource:
          type: cluster
        operations: [All]
        host: "*"
      - resource:
          type: transactionalId
          name: ""
          patternType: literal
        operations: [All]
        host: "*"
