apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-connect
  namespace: aqp-streaming
  labels:
    app.kubernetes.io/name: redpanda-connect
    app.kubernetes.io/component: streaming
    app.kubernetes.io/part-of: aqp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda-connect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda-connect
        app.kubernetes.io/component: streaming
        app.kubernetes.io/part-of: aqp
    spec:
      containers:
        - name: redpanda-connect
          image: docker.redpanda.com/redpandadata/connect:4.39.0
          args:
            - run
            - /etc/redpanda-connect/pipelines.yaml
          ports:
            - name: http
              containerPort: 4195
              protocol: TCP
          volumeMounts:
            - name: pipelines
              mountPath: /etc/redpanda-connect
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 30
      volumes:
        - name: pipelines
          configMap:
            name: redpanda-connect-pipelines
