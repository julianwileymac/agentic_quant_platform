# =============================================================================
# Dagster Credentials and Storage Configuration
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: dagster-postgresql
  namespace: aqp-mlops
type: Opaque
stringData:
  host: postgresql.aqp-data-services.svc.cluster.local
  port: "5432"
  database: dagster
  user: dagster
  password: dagster123
---
apiVersion: v1
kind: Secret
metadata:
  name: dagster-minio
  namespace: aqp-mlops
type: Opaque
# The Helm values mount this secret via `envFrom`, so every key here becomes
# an environment variable in the Dagster pods.  The AWS_* keys make boto3
# (used by S3ComputeLogManager and any user code touching S3) work out of
# the box without explicit configuration.
stringData:
  endpoint: minio.aqp-data-services.svc.cluster.local:9000
  accesskey: minioadmin
  secretkey: minioadmin123
  bucket: dagster-artifacts
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin123
  AWS_DEFAULT_REGION: us-east-1
  AWS_ENDPOINT_URL: http://minio.aqp-data-services.svc.cluster.local:9000
  AWS_S3_FORCE_PATH_STYLE: "true"
