# =============================================================================
# Model storage credentials consumed by KServe storage initializers + vLLM pods.
# =============================================================================
# These values MUST match the MODEL_ACCESS_KEY / MODEL_SECRET_KEY entries in
# `kubernetes/base-services/minio/service-credentials.yaml` (the bootstrap
# job in `bootstrap-buckets-job.yaml` provisions a MinIO user with those
# credentials and the `model-policy` policy attached, which grants read/write
# on the `model-registry`, `model-cache`, and `bentoml-artifacts` buckets).
#
# When you rotate the credential, rotate it in BOTH files at once.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: model-storage-credentials
  namespace: aqp-mlops
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "svc-models"
  AWS_SECRET_ACCESS_KEY: "svc-models-change-me"
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_ENDPOINT_URL: "http://minio.aqp-data-services.svc.cluster.local:9000"
  AWS_S3_ENDPOINT: "http://minio.aqp-data-services.svc.cluster.local:9000"
  AWS_S3_FORCE_PATH_STYLE: "true"
  S3_USE_HTTPS: "0"
  S3_VERIFY_SSL: "0"
