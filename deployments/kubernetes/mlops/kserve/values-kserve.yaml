# Optional KServe install values.
#
# KServe and its serving CRDs should be installed before applying
# InferenceService resources generated by the SDK. The plain vLLM deployments in
# this directory are safe to render without KServe CRDs and start scaled to zero.
kserve:
  controller:
    deploymentMode: RawDeployment
  storageInitializer:
    enableDirectPvcVolumeMount: true
  agent:
    enablePrometheusScraping: true
