apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Do not use commonLabels — kustomize injects them into NetworkPolicy
# podSelectors and breaks cross-namespace egress rules.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: aqp
      app.kubernetes.io/managed-by: kustomize
resources:
  - namespace.yaml
  # Phase 1 of the infra-expansion plan: AQP-owned shared infrastructure
  # namespaces. Empty until Phase 2 / Phase 5 fill in the workloads.
  - namespaces-shared.yaml
  - network-policies.yaml
  - rbac/service-accounts.yaml
  - rbac/cluster-roles.yaml
  - configmaps/aqp-config.yaml
  - configmaps/aqp-admin-config.yaml
  - secrets/aqp-secrets.yaml.template
  - secrets/aqp-admin-secrets.yaml.template
  # aqp-client (Vite + Solara + FastAPI gateway)
  - aqp-client/deployment.yaml
  - aqp-client/service.yaml
  - aqp-client/hpa.yaml
  - aqp-client/pdb.yaml
  # aqp-core (FastAPI API + business routes)
  - aqp-core/deployment.yaml
  - aqp-core/service.yaml
  - aqp-core/hpa.yaml
  - aqp-core/pdb.yaml
  # aqp-worker (Celery worker)
  - aqp-worker/deployment.yaml
  - aqp-worker/hpa.yaml
  - aqp-worker/pdb.yaml
  # aqp-cp (control plane micro-project)
  - aqp-cp/deployment.yaml
  - aqp-cp/service.yaml
  - aqp-cp/pdb.yaml
  # Redis Stack (cache + HierarchicalRAG store)
  - redis-master/statefulset.yaml
  # AQP-owned shared infra aggregators (each empty in Phase 1; Phase 2
  # and Phase 5 fill in the actual workload manifests). Listed here so
  # `kubectl apply -k deployments/kubernetes/base/` walks every group.
  - ../base-services
  - ../observability
  - ../mlops
  - ../edge
  # Ingress (TLS + Auth0 enforcement)
  - ingress.yaml
