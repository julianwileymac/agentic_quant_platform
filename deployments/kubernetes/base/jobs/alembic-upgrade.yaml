# One-shot schema migration for the aqp namespace. Apply after aqp-core image
# is pullable and before cutting traffic to a new API revision.
#
#   kubectl apply -f deployments/kubernetes/base/jobs/alembic-upgrade.yaml
#   kubectl -n aqp wait --for=condition=complete job/aqp-alembic-upgrade --timeout=600s
#   kubectl -n aqp logs job/aqp-alembic-upgrade
apiVersion: batch/v1
kind: Job
metadata:
  name: aqp-alembic-upgrade
  namespace: aqp
  labels:
    app.kubernetes.io/name: aqp-alembic-upgrade
    app.kubernetes.io/part-of: aqp
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aqp-alembic-upgrade
        app.kubernetes.io/part-of: aqp
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      containers:
        - name: migrate
          image: docker.io/julian0215/aqp-api:dev
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              alembic upgrade head
              alembic current
          envFrom:
            - configMapRef:
                name: aqp-config
            - secretRef:
                name: aqp-secrets
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
