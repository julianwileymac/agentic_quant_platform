apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqp-core
  namespace: aqp
  labels:
    app: aqp-core
    app.kubernetes.io/name: aqp-core
    app.kubernetes.io/part-of: aqp
    app.kubernetes.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aqp-core
  template:
    metadata:
      labels:
        app: aqp-core
        app.kubernetes.io/name: aqp-core
        app.kubernetes.io/part-of: aqp
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: aqp-core
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: docker.io/julian0215/aqp-api:dev
          imagePullPolicy: Always
          command: ["uvicorn", "aqp.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: aqp-config
            - secretRef:
                name: aqp-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          # Phase 4b control-plane maturation: split the single
          # /health probe into Kubernetes-native /livez (no deps,
          # used by the kubelet to decide whether to restart the pod)
          # and /readyz (Postgres + Redis + Auth0 JWKS, used to gate
          # Service endpoint inclusion). /health remains for external
          # dashboards.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 60  # ~5 min startup window
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/aqp/.cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: aqp-core
      # Phase 4c control-plane maturation: prefer ARM64 nodes so
      # workloads land on the rpi_kubernetes RPi5 edge cluster when
      # mixed-arch nodes are available, but never refuse to schedule
      # in a single-arch (amd64-only) test cluster. The image must be
      # multi-arch (built via the ``build-multi-arch.yml`` workflow).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["arm64"]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["arm64"]
