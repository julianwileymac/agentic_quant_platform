apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-master
  namespace: aqp
  labels:
    app: redis-master
    app.kubernetes.io/name: redis-master
    app.kubernetes.io/part-of: aqp
    app.kubernetes.io/component: cache
spec:
  serviceName: redis-master-headless
  replicas: 1
  selector:
    matchLabels:
      app: redis-master
  template:
    metadata:
      labels:
        app: redis-master
        app.kubernetes.io/name: redis-master
        app.kubernetes.io/part-of: aqp
        app.kubernetes.io/component: cache
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis/redis-stack:7.4.0-v3
          imagePullPolicy: IfNotPresent
          command:
            - redis-stack-server
            - /etc/redis/redis.conf
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
            - name: redis-insight
              containerPort: 8001
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Redis needs to write to /data
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop:
                - ALL
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
            - name: redis-config
              mountPath: /etc/redis
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
      # Pod anti-affinity vs ML workers — Redis hot path should not
      # share a node with a long-running training job that's about
      # to OOM.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: aqp-worker
                topologyKey: kubernetes.io/hostname
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: aqp
  labels:
    app: redis-master
    app.kubernetes.io/part-of: aqp
spec:
  type: ClusterIP
  selector:
    app: redis-master
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
    - name: redis-insight
      port: 8001
      targetPort: redis-insight
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: redis-master-headless
  namespace: aqp
  labels:
    app: redis-master
    app.kubernetes.io/part-of: aqp
spec:
  clusterIP: None
  selector:
    app: redis-master
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: aqp
  labels:
    app: redis-master
    app.kubernetes.io/part-of: aqp
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode no
    port 6379
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300
    daemonize no
    supervised no
    pidfile /tmp/redis.pid
    loglevel notice
    databases 16
    save 900 1
    save 300 10
    save 60 10000
    stop-writes-on-bgsave-error yes
    rdbcompression yes
    rdbchecksum yes
    dbfilename dump.rdb
    dir /data
    maxmemory-policy allkeys-lru
    # Redis Stack modules — JSON, Search, TimeSeries, Bloom
    loadmodule /opt/redis-stack/lib/rejson.so
    loadmodule /opt/redis-stack/lib/redisearch.so
    loadmodule /opt/redis-stack/lib/redistimeseries.so
    loadmodule /opt/redis-stack/lib/redisbloom.so
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-master
  namespace: aqp
  labels:
    app.kubernetes.io/part-of: aqp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: redis-master
