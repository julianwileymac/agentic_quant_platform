apiVersion: v1
kind: Service
metadata:
  name: phoenix
  namespace: aqp-observability
  labels:
    app.kubernetes.io/name: phoenix
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: aqp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: phoenix
  ports:
    - name: ui-http
      port: 6006
      targetPort: 6006
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
