# Auto-instrumentation injection for AQP Python pods (FastAPI app, Celery
# workers, beat, control-plane). Pods opt in by adding the annotation:
#   instrumentation.opentelemetry.io/inject-python: "aqp-observability/aqp-python"
# Once a pod has this annotation the operator injects the Python
# OpenTelemetry SDK and configures OTLP export to the local DaemonSet.
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: aqp-python
  namespace: aqp-observability
  labels:
    app.kubernetes.io/part-of: aqp
spec:
  exporter:
    endpoint: http://localhost:4318
  propagators:
    - tracecontext
    - baggage
    - b3
  sampler:
    type: parentbased_traceidratio
    argument: "1.0"
  resource:
    attributes:
      - key: deployment.environment
        value: production
      - key: aqp.platform
        value: "true"
  python:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:0.46b0
    env:
      # Match aqp.config.settings.otel_endpoint default behaviour: fall through
      # to the local DaemonSet first, then to the gateway.
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://localhost:4318
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - name: OTEL_PYTHON_LOG_CORRELATION
        value: "true"
      - name: OTEL_PYTHON_DISABLED_INSTRUMENTATIONS
        value: ""
