apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: aqp-observability
  labels:
    app.kubernetes.io/part-of: aqp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aqp-otel-collector
  labels:
    app.kubernetes.io/part-of: aqp
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aqp-otel-collector
  labels:
    app.kubernetes.io/part-of: aqp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aqp-otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: aqp-observability
