apiVersion: v1
kind: ConfigMap
metadata:
  name: opentelemetry-operator-values
  namespace: aqp-observability
  labels:
    app.kubernetes.io/name: opentelemetry-operator
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: aqp
data:
  values.yaml: |
    # The chart deploys the OpenTelemetry Operator that owns the
    # OpenTelemetryCollector + Instrumentation CRs.
    admissionWebhooks:
      certManager:
        enabled: false
      autoGenerateCert:
        enabled: true
    manager:
      collectorImage:
        repository: otel/opentelemetry-collector-contrib
        tag: 0.110.0
      featureGates: '+operator.autoinstrumentation.python.gourdmind'
    crds:
      create: true
