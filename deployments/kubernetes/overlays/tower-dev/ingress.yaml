# Mirror of deployments/kubernetes/base/ingress.yaml for the tower overlays.
# tower-green applies host patches for blue/green cutover validation.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aqp-client
  namespace: aqp
  labels:
    app.kubernetes.io/part-of: aqp
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - aqp.fund
      secretName: aqp-client-tls
  rules:
    - host: aqp.fund
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aqp-client
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aqp-core
  namespace: aqp
  labels:
    app.kubernetes.io/part-of: aqp
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.aqp.fund
      secretName: aqp-core-tls
  rules:
    - host: api.aqp.fund
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aqp-core
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aqp-cp
  namespace: aqp-admin
  labels:
    app.kubernetes.io/part-of: aqp
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - manage.aqp.fund
      secretName: aqp-cp-tls
  rules:
    - host: manage.aqp.fund
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aqp-cp
                port:
                  number: 80
