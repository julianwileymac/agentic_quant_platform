[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aqp-bots"
version = "0.2.0"
description = "Bot runtime, operator, adapters, and HFT primitives for the Agentic Quant Platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AQP Platform Team" }]
dependencies = [
    # Core spec / runtime
    "pydantic>=2.5",
    "PyYAML>=6.0",
    # Hot-path schemas (~12x faster JSON than Pydantic v2 per msgspec benchmarks)
    "msgspec>=0.18",
    # UUIDv7 (time-ordered) for client_order_id / event seq_no
    "uuid-utils>=0.9",
    # Async accelerator (kernel single-thread loop)
    "uvloop>=0.19 ; sys_platform != 'win32'",
    # Rate limiting / retry plumbing for REST adapter family
    "aiolimiter>=1.1",
    "tenacity>=8.2",
    # Lightweight HTTP client used by REST adapters + risk service
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.8",
]
# Kubernetes Operator (kopf-based, Phase 8)
operator = [
    "kopf>=1.37",
    "kubernetes-asyncio>=29",
    "kubernetes>=29",
    "jinja2>=3.1",
]
# HFT hot path (Phase 7) — Cython SPSC ring buffer, PTP, NUMA
hft = [
    "cython>=3.0",
    "numpy>=1.26",
]
# FIX venue adapters (Phase 3)
fix = [
    "simplefix>=1.0.16",
]
# On-chain venue adapters (Phase 3)
onchain = [
    "web3>=6.0",
]
# OpenTelemetry instrumentation (Phase 6)
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[project.scripts]
aqp-bots = "aqp_bots.cli:main"
aqp-bots-operator = "aqp_bots.operator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.sdist]
include = [
    "*.py",
    "templates/**/*.yaml",
    "README.md",
    "AGENTS.md",
    "INDEX.md",
    "pyproject.toml",
]

