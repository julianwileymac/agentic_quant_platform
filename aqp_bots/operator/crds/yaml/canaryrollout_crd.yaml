apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: canaryrollouts.quantbot.io
spec:
  group: quantbot.io
  scope: Namespaced
  names:
    kind: CanaryRollout
    listKind: CanaryRolloutList
    plural: canaryrollouts
    singular: canaryrollout
    shortNames: [canary]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Bot
          type: string
          jsonPath: .spec.botRef
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Step
          type: integer
          jsonPath: .status.currentStep
        - name: Weight
          type: integer
          jsonPath: .status.currentWeight
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                botRef: { type: string }
                canarySpecRef: { type: string }
                stableSpecRef: { type: string }
                steps:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      weight: { type: integer }
                      pauseSeconds: { type: integer }
                      pauseIndefinite: { type: boolean }
                      analysis:
                        type: array
                        items: { type: string }
                analysis:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    pnlVsStableMinUsd: { type: number }
                    rejectRateMaxPct: { type: number }
                    p99LatencyMaxSeconds: { type: number }
                maxAbortRolloutPnlBleedUsd: { type: number }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
