apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: killswitches.quantbot.io
spec:
  group: quantbot.io
  scope: Namespaced
  names:
    kind: KillSwitch
    listKind: KillSwitchList
    plural: killswitches
    singular: killswitch
    shortNames: [ks]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Scope
          type: string
          jsonPath: .spec.scope
        - name: Target
          type: string
          jsonPath: .spec.target
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Engaged
          type: boolean
          jsonPath: .status.engaged
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [scope, target]
              properties:
                scope:
                  type: string
                  enum: [bot, fleet, platform]
                target: { type: string }
                mode:
                  type: string
                  enum: [cancel, flatten, freeze]
                reason: { type: string }
                ttl: { type: string }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
