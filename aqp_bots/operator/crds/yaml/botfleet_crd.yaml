apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: botfleets.quantbot.io
spec:
  group: quantbot.io
  scope: Namespaced
  names:
    kind: BotFleet
    listKind: BotFleetList
    plural: botfleets
    singular: botfleet
    shortNames: [fleet]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Bots
          type: integer
          jsonPath: .status.botCount
        - name: Running
          type: integer
          jsonPath: .status.runningBotCount
        - name: Halted
          type: integer
          jsonPath: .status.haltedBotCount
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                description: { type: string }
                botSelector:
                  type: object
                  additionalProperties: { type: string }
                sharedRiskPolicyRefs:
                  type: array
                  items: { type: string }
                maxCapitalUsd: { type: string }
                maxBotCount: { type: integer }
                halt: { type: boolean }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
