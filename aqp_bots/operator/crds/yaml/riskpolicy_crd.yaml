apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: riskpolicies.quantbot.io
spec:
  group: quantbot.io
  scope: Namespaced
  names:
    kind: RiskPolicy
    listKind: RiskPolicyList
    plural: riskpolicies
    singular: riskpolicy
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: BotsBound
          type: integer
          jsonPath: .status.botsBound
        - name: MaxOrderValueUsd
          type: string
          jsonPath: .spec.hardLimits.maxOrderValueUsd
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                description: { type: string }
                targets:
                  type: array
                  items: { type: string }
                instrumentAllowlist:
                  type: array
                  items: { type: string }
                hardLimits:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    priceCollarBps: { type: integer }
                    maxOrderValueUsd: { type: string }
                    maxOrderQty: { type: string }
                    maxMessagesPerSecond: { type: integer }
                    repeatedExecutionThrottleMs: { type: integer }
                softLimits:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                riskServiceEndpoint: { type: string }
                failOpen: { type: boolean }
                citations:
                  type: array
                  items: { type: string }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
