apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: strategies.quantbot.io
spec:
  group: quantbot.io
  scope: Namespaced
  names:
    kind: Strategy
    listKind: StrategyList
    plural: strategies
    singular: strategy
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Class
          type: string
          jsonPath: .spec.moduleClass
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: BotsUsing
          type: integer
          jsonPath: .status.botsUsing
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                moduleClass: { type: string }
                modulePath: { type: string }
                version: { type: string }
                description: { type: string }
                parameters:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                references:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                checksum: { type: string }
                requiredAdapters:
                  type: array
                  items: { type: string }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
